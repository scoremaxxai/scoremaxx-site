// ---------- PRACTICE DRILLS ----------
let PR = null;
// Recover the practice topic for a plan step: use the stored skill, or parse it
// from a "Fix: <skill> (x/y correct)" title so plans made before this update still work.
function planSkill(step){
  if(step.skill) return step.skill;
  const t = step.title||'';
  const m = t.match(/^Fix:\s*(.+?)\s*\(/);

async function startConceptPractice(conceptNo, skillKey, mode, subRecipe){
  let items = null;
  try{
    const {data} = await db.from('math_items').select('*').eq('concept_no', conceptNo).eq('is_servable', true);
    items = data;
  }catch(_){ items = null; }
  if(!items || !items.length) return false;
  let label = skillKey;
  try{
    const {data:r} = await db.from('math_recipes').select('concept_name').eq('concept_no', conceptNo).limit(1).maybeSingle();
    if(r && r.concept_name) label = r.concept_name;
  }catch(_){}
  // sub-bank picker: grouped topics (e.g. all shifts together), or everything
  if(SUBBANKS[conceptNo] && subRecipe === undefined){
    const groups = SUBBANKS[conceptNo];
    const el = document.getElementById('v-practice');
    el.innerHTML = '<div class="card"><h2>' + esc(label) + '</h2>'
      + '<p class="dim">Pick a question bank to work on:</p>'
      + '<select id="subbank" style="padding:10px 12px;margin:12px 0;border-radius:8px;min-width:260px;font-size:15px">'
      + '<option value="">All types (mixed)</option>'
      + groups.map(g=>'<option value="' + esc(g.recipes.join(',')) + '">' + esc(g.label) + '</option>').join('')
      + '</select>'
      + '<div class="row" style="gap:8px"><button class="btn" onclick="startConceptPractice(' + conceptNo
      + ', \'' + esc(skillKey) + '\', \'' + esc(mode) + '\', document.getElementById(\'subbank\').value)">Start practice</button>'
      + '<button class="btn2" onclick="renderHome().then(()=>go(\'home\'))">Back to dashboard</button></div></div>';
    return true;
  }
  if(subRecipe){
    const allow = subRecipe.split(',');
    items = items.filter(it=>allow.indexOf(it.recipe_id) !== -1);
    if(!items.length) return false;
  }
  // surface cycle: deal one question from each surface (recipe_id) per round,
  // in random order within the round — question types alternate instead of
  // clumping. Concept 15 re-deals below by figure kind instead.
  let pool;
  {
    const bySurf = {};
    items.forEach(it=>{ (bySurf[it.recipe_id] = bySurf[it.recipe_id]||[]).push(it); });
    // every round contains each type exactly once; the ORDER inside each
    // round reshuffles (ABCD, DCBA, BDAC, ...) so students must diagnose
    // the type before solving — interleaving, with guaranteed coverage.
    // Even sub-forms: a surface usually holds two variants (e.g. 15 rays and 15
    // segments). A blind shuffle lets one variant cluster, so instead shuffle
    // each variant separately and round-robin them. Items tag their variant as
    // art_payload.fold; untagged items fall back to a plain shuffle.
    const foldOf = it => { const p = it && it.art_payload; return (p && p.fold) || null; };
    function stratify(g){
      const by = {}, order = [];
      g.forEach(it=>{ const f = foldOf(it) || '_'; if(!by[f]){ by[f] = []; order.push(f); } by[f].push(it); });
      if(order.length < 2) return g.sort(()=>Math.random()-0.5);
      order.forEach(k=>by[k].sort(()=>Math.random()-0.5));
      order.sort(()=>Math.random()-0.5);          // which variant leads varies by session
      const out = [];
      for(let i=0; out.length < g.length; i++){
        let placed = false;
        for(const k of order){ if(i < by[k].length){ out.push(by[k][i]); placed = true; } }
        if(!placed) break;
      }
      return out;
    }
    const groups = Object.values(bySurf).map(stratify);
    // Scenario spacing: items may tag their scenario as art_payload.ctx (e.g. the
    // cats-and-dogs table). Two items sharing a ctx should not land close
    // together, even when they come from different surfaces. Items with no ctx
    // tag are unaffected.
    const ctxOf = it => { const p = it && it.art_payload; return (p && p.ctx) || null; };
    const CTX_WINDOW = 22;   // tuned: minimises repeats inside any 10-question span
    const recent = [];
    const seenRecently = c => c && recent.indexOf(c) !== -1;
    const mixed = [];
    for(let i=0; groups.some(g=>i<g.length); i++){
      const live = groups.filter(g=>i<g.length);
      const round = live.map(g=>g[i]);
      round.sort(()=>Math.random()-0.5);
      // for any item whose scenario is still fresh in memory, try to swap it
      // with a later item from its own surface that uses a different scenario
      for(let k=0; k<round.length; k++){
        const c = ctxOf(round[k]);
        if(!c) continue;
        const clash = seenRecently(c) ||
          round.slice(0, k).some(o=>ctxOf(o) === c);
        if(!clash) continue;
        const g = live.find(gr=>gr.indexOf(round[k]) !== -1);
        if(!g) continue;
        const myFold = foldOf(round[k]);
        let swapAt = -1, fallback = -1;
        for(let j=i+1; j<g.length; j++){
          const alt = ctxOf(g[j]);
          if(alt && (seenRecently(alt) || round.some(o=>ctxOf(o) === alt))) continue;
          if(foldOf(g[j]) === myFold){ swapAt = j; break; }   // keeps folds even
          if(fallback === -1) fallback = j;
        }
        if(swapAt === -1) swapAt = fallback;
        if(swapAt !== -1){
          const at = g.indexOf(round[k]);
          const tmp = g[at]; g[at] = g[swapAt]; g[swapAt] = tmp;
          round[k] = g[at];
        }
      }
      round.forEach(it=>{
        const c = ctxOf(it);
        if(c){ recent.push(c); while(recent.length > CTX_WINDOW) recent.shift(); }
      });
      mixed.push(...round);
    }
    pool = mixed.map(it=>adaptMathItem(it, label));
  }
  // concept 19: fixed rotation — word (circle) → endpoint → grid graph → number
  // line, repeating in that exact order. Random only within each type.
  if(conceptNo === 19){
    const ORDER = ['R03D', 'R03B', 'R03A', 'R03C'];
    const by19 = {};
    items.forEach(it=>{ (by19[it.recipe_id] = by19[it.recipe_id]||[]).push(it); });
    const gs = ORDER.map(r=>(by19[r]||[]).sort(()=>Math.random()-0.5));
    const seq = [];
    for(let i=0; gs.some(g=>i<g.length); i++)
      for(const g of gs) if(i<g.length) seq.push(g[i]);
    pool = seq.map(it=>adaptMathItem(it, label));
  }
  // concept 15 only: draw evenly from the two figure kinds (rect / box) so a
  // 10-question session is always 5 of each, in random order. Other concepts
  // are untouched.
  if(conceptNo === 15){
    const kindOf = q => (q.art_payload && (q.art_payload.kind || q.art_payload.type)) || 'none';
    const rects = pool.filter(q=>kindOf(q)==='rect'), boxes = pool.filter(q=>kindOf(q)==='box'),
          rest = pool.filter(q=>kindOf(q)!=='rect' && kindOf(q)!=='box');
    const mixed = [];
    for(let i=0; i<Math.max(rects.length, boxes.length); i++){
      const pair = Math.random() < 0.5 ? [rects[i], boxes[i]] : [boxes[i], rects[i]];
      pair.forEach(q=>{ if(q) mixed.push(q); });
    }
    pool = mixed.concat(rest);
  }
  let sessionId = null;
  try{
    const {data:sess} = await db.from('practice_sessions').insert({student_id:ME.id, skill:label, total:Math.min(10,pool.length)}).select().single();
    sessionId = sess ? sess.id : null;
  }catch(_){}
  const target = mode==='careless' ? Math.min(6, pool.length) : Math.min(10, pool.length);
  PR = {skill:skillKey, skillLabel:label, mode, pool, idx:0, target, rec:[], cur:null, curAnswer:null, pending:null, awaitConf:false, streak:0, best:0, qLimit:0, qRemaining:0, qTimerId:null, sessionId, newBank:true};
  advancePQ();
  return true;
}

    h += '<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" onclick="advancePQ()">'+(isLast?'Finish & see report':'New question →')+'</button></div>';

    h += '<div class="notice" style="border-left-color:var(--good)"><b style="color:var(--good)">Correct!</b>'
      +(mode==='careless'?' <b style="color:var(--cyan)">Streak: '+PR.streak+'/'+PR.target+'.</b>':'')
      +(mode==='confidence'?' <b style="color:var(--purple)">First instinct: right ('+instinctPct+'% so far).</b>':'')
      +(mode==='timing' && PR.rec.length && PR.rec[PR.rec.length-1].time!=null ? ' <span class="dim">('+PR.rec[PR.rec.length-1].time+'s of '+PR.qLimit+'s)</span>':'')
      +' '+esc(q.explanation||'')+'</div>';
    if(mode==='confidence') h += '<div class="notice" style="border-left-color:var(--purple);margin-top:10px"><b style="color:var(--purple)">Trust yourself:</b> '+TRUST_MSGS[(nRight-1) % TRUST_MSGS.length]+'</div>';
    h += '<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" onclick="advancePQ()">'+(isLast?'Finish & see report':'Next question →')+'</button></div>';

    h += '<div class="notice" style="border-left-color:var(--bad)"><b style="color:var(--bad)">Not quite — the answer is '+q.correct_choice+'.</b>'

      +(mode==='confidence'?' <b style="color:var(--purple)">First instinct: wrong this time.</b>':'')
      +(q.misconception?'<br><br><b style="color:var(--warn)">The misconception:</b> '+esc(q.misconception):'')
      +(q.explanation?'<br><br><b style="color:var(--good)">Why '+q.correct_choice+' is right:</b> '+esc(q.explanation):'')+'</div>';

  } else if(mode==='confidence' && PR.awaitConf){
    h += '<div style="margin-top:14px"><span class="dim" style="font-size:12px">Answer locked in. How confident are you?</span><div class="row" style="margin-top:8px">'

  document.getElementById('v-practice').innerHTML = h;
  window.scrollTo(0,0);
}
function pickP(L){
  if(PR.curAnswer!==null) return;
  if(PR.mode==='careless'){ PR.pending = L; renderPQ(); return; }
  if(PR.mode==='confidence'){
    if(PR.pending!==null) return;
    PR.pending = L; PR.awaitConf = true; renderPQ(); return;
  }
  commitP(L);
}
function commitP(L, conf){
  if(PR.curAnswer!==null) return;
  if(PR.qTimerId){ clearInterval(PR.qTimerId); PR.qTimerId=null; }
  PR.curAnswer = L;
  PR.awaitConf = false;
  const correct = L===PR.cur.correct_choice;
  if(correct){ PR.streak++; PR.best = Math.max(PR.best, PR.streak); } else { PR.streak = 0; }
  if(PR.newBank && !correct && PR.cur._rats && PR.cur._rats[L]) PR.cur.misconception = PR.cur._rats[L];
  PR.rec.push({q:PR.cur, answer:L, correct, conf:conf||null, time: PR.mode==='timing' ? (PR.qLimit - PR.qRemaining) : null});
  if(PR.sessionId && !PR.newBank) db.from('practice_attempts').insert({session_id:PR.sessionId, question_id:PR.cur.id, position:PR.rec.length, answer:L, correct}).then(()=>{});
  if(PR.newBank) db.rpc('mark_math_item_seen', {p_student:ME.id, p_item:PR.cur.id}).then(()=>{}).catch(()=>{});
  renderPQ();
}
// record a study-plan day's drill result. pct = accuracy (color-coded % under gem); met = did they
// attempt the full question goal (gold gem) or bail early (grey gem).
function recordQuestDay(pct, met){
  try{ if(window.__questDay){ const q=window.__questDay; if(q.planId && q.day){
    let sc={}; try{ sc=JSON.parse(localStorage.getItem('smx_qscore_'+q.planId)||'{}'); }catch(_){}
    sc[q.day]= sc[q.day]!=null ? Math.round((sc[q.day]+pct)/2) : pct;
    localStorage.setItem('smx_qscore_'+q.planId, JSON.stringify(sc));
    let mt={}; try{ mt=JSON.parse(localStorage.getItem('smx_qmet_'+q.planId)||'{}'); }catch(_){}
    mt[q.day] = !!met || !!mt[q.day];   // once the goal is hit it stays hit
    localStorage.setItem('smx_qmet_'+q.planId, JSON.stringify(mt));
    if(typeof db!=='undefined' && ME) db.from('quest_days').upsert({student_id:ME.id, plan_id:q.planId, day_num:q.day, completed:mt[q.day], accuracy:sc[q.day]}, {onConflict:'student_id,plan_id,day_num'}).then(()=>{}).catch(()=>{});
    window.__questDay=null;
  }} }catch(_){}
}
// exiting a drill early still banks accuracy + whether the question goal was reached
function exitPractice(){
  try{ const nTried = (PR&&PR.rec) ? PR.rec.length : 0; if(nTried>0 && window.__questDay){ const met = nTried >= (PR.target||10); recordQuestDay(Math.round(100*prRight()/nTried), met); } }catch(_){}
  renderPlans();   // back to the study plan (quest map), not the dashboard
}
async function practiceReport(){

  let h = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Practice Report — '+esc(PR.skill.replace(/_/g,' '))+' <span class="pill '+PMODE_PILL[mode]+'">'+PMODE_LABEL[mode]+'</span></h2><span class="row"><button class="btn2" onclick="window.print()">Print report</button><button class="btn2" onclick="renderHome().then(()=>go(\'home\'))">Back to dashboard</button></span></div>'

             :'<div class="notice" style="border-left-color:var(--warn);margin-top:14px"><b style="color:var(--warn)">Bank exhausted</b> before reaching '+goalTxt+' — review the misses below, then start fresh.</div>')
    +confNote
    +'<div class="statgrid" style="margin-top:16px">'

    +'<div class="stat"><div class="v">'+nTried+'</div><div class="l">Questions attempted</div></div>'
    +'<div class="stat"><div class="v" style="color:'+col+'">'+pct+'%</div><div class="l">Accuracy</div></div>'
    +modeStats

    +['content','timing','confidence','careless'].filter(m=>m!==mode).map(m=>'<button class="btn2" onclick="startPractice(PR.skill,\''+m+'\')">'+PMODE_LABEL[m]+' mode</button>').join('')
    +'</div></div>';

let QSTATE = null;
function qPretty(s){ s = String(s||'').replace(/_/g,' '); return s.charAt(0).toUpperCase()+s.slice(1); }
function qBuildNodes(pl, goal){
  const steps = (pl.plan_steps||[]).sort((a,b)=>a.position-b.position);
  const nodes = [];
  const hasNaturalChecks = steps.some(st=>/retest|practice test/i.test(st.title||''));
  const secs = ['english','math','reading','science'];
  let day = 0, ci = 0;
  steps.forEach((st,i)=>{
    day++;
    const isCheck = /retest|practice test/i.test(st.title||'');
    const sk = planSkill(st);
    nodes.push({kind:isCheck?'check':'day', st, day,
      sub: isCheck ? st.title.replace(/^.*?:\s*/,'') : (sk ? qPretty(sk) : (st.title||'').replace(/^Fix:\s*/i,'').slice(0,18)),
      done: st.status==='done', sec: null});
    if(!hasNaturalChecks && (i+1)%5===0 && i<steps.length-1){
      const sec = secs[ci++ % 4];
      nodes.push({kind:'check', st:null, virtual:true, vIdx:nodes.length, sec,
        sub: qPretty(sec)+' retest',
        done: localStorage.getItem('smx_qc_'+pl.id+'_'+nodes.length)==='1'});
    }
  });
  nodes.push({kind:'final', st:null, sub: (goal&&goal.target_date)?('The ACT \u00b7 '+goal.target_date):'The ACT', done:false});
  return nodes;
}

let QRAF = null;

function m4weekendsOff(pl){ return localStorage.getItem('smx_weekends_'+pl.id) !== 'on'; } // default: weekends OFF
function m4build(pl, goal){
  const raw = (pl.plan_steps||[]).sort((a,b)=>a.position-b.position);
  const start = new Date((pl.created_at?String(pl.created_at).slice(0,10):new Date().toISOString().slice(0,10))+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const weekendsOff = m4weekendsOff(pl);
  // build the list of eligible STUDY dates from start \u2192 test date; weekends excluded when off
  let end = goal && goal.target_date ? new Date(goal.target_date+'T00:00:00') : new Date(start.getTime()+29*86400000);
  const dates = [];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const dow=d.getDay();
    if(weekendsOff && (dow===0||dow===6)) continue;   // skip Sat/Sun \u2014 they don't count toward the plan
    dates.push(new Date(d));
  }
  if(!dates.length) dates.push(new Date(start));
  // cap length at 60 study days (min: whatever is available \u2014 plans under 30 days are allowed,
  // they simply fall outside the money-back-guarantee window handled at purchase)
  let studyDates = dates.length>60 ? dates.slice(dates.length-60) : dates;
  const total = studyDates.length;
  const WK = weekendsOff ? 5 : 7;                       // one retest at the end of each week
  // today = number of study dates on/before now (completion still gates the "current" node in render)
  let today = 0; studyDates.forEach(dt=>{ if(dt<=now) today++; }); today = m4clamp(today, 1, total+1);
  const focus = raw.map(st=>({title:(st.title||'').replace(/^Fix:\s*/i,''), desc:st.description||'', skill:planSkill(st), st})).filter(f=>f.skill||f.title);
  const days = []; let fi=0;
  for(let i=0;i<total;i++){
    const d=i+1, dt=studyDates[i];
    if(d===total){ days.push({day:d, dt, kind:'act'}); continue; }
    if(d%WK===0){ days.push({day:d, dt, kind:'retest', sec:M4_ORDER[(Math.floor(d/WK)-1)%4]}); continue; }
    const f = focus.length ? focus[fi++%focus.length] : null;
    const tasks = f
      ? ['Watch the '+(f.title||'skill').toLowerCase()+' lesson','Drill '+(f.title||'this skill').toLowerCase()+' to 10 correct'].concat(d%3===0?['Quick review of the past 2 days']:[])
      : ['Warm-up: review yesterday\u2019s notes','Core skill practice (20 min)','Challenge problem of the day'];
    days.push({day:d, dt, kind:'day', focus:f, tasks});
  }
  return {total, today, cleared:m4clamp(today-1,0,total), days, weekendsOff, SCORES:m4scores(pl), MET:m4met(pl), pl, goal};
}

function m4layout(){
  const map = document.getElementById('m-map');
  const wRaw = map.clientWidth || 600;
  // mobile: narrower 5-wide grid that fits a phone; desktop: 7-wide centered band. Both paginate.
  const isMobile = document.body.classList.contains('mview') || wRaw < 620;
  const cols = isMobile ? 5 : 7;                 // gems per row
  const ROWS_PER_PAGE = isMobile ? 5 : 6;        // → mobile 25/page, desktop 42/page
  const capW = isMobile ? 560 : 880;
  const w = Math.min(wRaw, capW);
  const xOff = Math.max(0, (wRaw - w) / 2);
  const N = M4.total;
  const perPage = cols*ROWS_PER_PAGE;
  const pages = Math.max(1, Math.ceil(N/perPage));
  M4.perPage=perPage; M4.pages=pages;
  // first render: land on the page that holds "today"
  if(M4.page==null) M4.page=Math.floor((m4clamp(M4.today,1,N)-1)/perPage);
  M4.page=m4clamp(M4.page,0,pages-1);
  const start=M4.page*perPage, end=Math.min(start+perPage,N), count=end-start;
  M4.pageStart=start;
  const rows=Math.ceil(count/cols);
  const mX = w<480?40:56, GY=112, usable=w-mX*2;
  M4.curveScale = 1;                          // fixed spacing → original mobile wobble constants
  const nodes=[];
  for(let i=0;i<count;i++){ const gi=start+i; const r=Math.floor(i/cols); let c=i%cols; if(r%2===1)c=cols-1-c; const x=xOff+mX+(cols===1?usable/2:usable*c/(cols-1)); const wob=Math.sin(gi*2.7)*12; const y=52+r*GY+wob; nodes.push({x,y,day:start+i+1}); }
  map.style.height=(52+rows*GY+30)+'px';
  M4.nodes=nodes; M4.w=wRaw;
}
function m4trail(){
  const map=document.getElementById('m-map'), svg=document.getElementById('m-trail'), nodes=M4.nodes;

  const gStart=M4.pageStart||0, sc=M4.curveScale||1;
  let base='';
  for(let i=0;i<nodes.length-1;i++){ const a=nodes[i],b=nodes[i+1]; const gi=gStart+i; const mx=(a.x+b.x)/2+Math.sin(gi*1.3)*16*sc, my=(a.y+b.y)/2+Math.cos(gi*1.7)*9*sc; base+='M '+a.x+' '+a.y+' Q '+mx+' '+my+' '+b.x+' '+b.y+' '; }
  let doneD=''; const doneLocal=m4clamp(M4.cleared-gStart,0,nodes.length);
  for(let i=0;i<Math.min(doneLocal,nodes.length-1);i++){ const a=nodes[i],b=nodes[i+1]; const gi=gStart+i; const mx=(a.x+b.x)/2+Math.sin(gi*1.3)*16*sc, my=(a.y+b.y)/2+Math.cos(gi*1.7)*9*sc; doneD+='M '+a.x+' '+a.y+' Q '+mx+' '+my+' '+b.x+' '+b.y+' '; }
  svg.innerHTML='<defs><linearGradient id="m-vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>'

// Resolve a drillable skill for a day. Falls back through the plan so that habit-only
// days (which have a title but no skill) still get working Learn / Practice buttons.
function m4skillFor(dd){
  if(dd && dd.focus && dd.focus.skill) return dd.focus.skill;
  try{
    const steps = (M4 && M4.pl && M4.pl.plan_steps) || [];
    const withSkill = steps.slice().sort((a,b)=>a.position-b.position)
                           .map(planSkill).filter(Boolean);
    if(withSkill.length) return withSkill[(Math.max(1,(dd&&dd.day)||1)-1) % withSkill.length];
  }catch(_){}
  return null;
}

    return '<tr><td><b>'+esc(st.full_name||'(no name)')+'</b></td><td>'+ss.length+'</td>'+
      '<td>'+(last? last.started_at.slice(0,10)+' · '+esc(last.tests?.name||'') : '<span class="dim">never</span>')+'</td>'+
      '<td>'+(last? '<b>'+last.est_score+'</b>' : '—')+'</td>'+
      '<td>'+(last? '<a class="link" onclick="openSession(\''+last.id+'\')">Latest report</a>':'')+'</td></tr>';
  }).join('');
  el.innerHTML='<div class="card"><h2>Tutor Dashboard — Student Roster</h2>'+
    (rows?'<table><tr><th>Student</th><th>Tests taken</th><th>Last test</th><th>Last score</th><th></th></tr>'+rows+'</table>'
    :'<div class="emptystate"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg><br><b>No students yet</b><br>Send students your site link — they create accounts, take a diagnostic, and appear here automatically.</div>')+
    '<div class="notice">All sessions: '+(sessions||[]).length+'. Full per-student trend views land in the next build phase.</div></div>'+
    '<div class="card"><h2>Recent Sessions</h2><table><tr><th>Date</th><th>Test</th><th>Raw</th><th>Score</th><th></th></tr>'+
    (sessions||[]).slice(0,20).map(s=>'<tr><td>'+s.started_at.slice(0,10)+'</td><td>'+esc(s.tests?.name||'')+'</td><td>'+s.raw_correct+'/'+s.raw_total+'</td><td><b>'+s.est_score+'</b></td><td><a class="link" onclick="openSession(\''+s.id+'\')">Report</a></td></tr>').join('')+'</table></div>';
}

boot();



</script>
</body>
</html>
