// ---------- TEST ENGINE ----------
// anchors for insert/placement questions that have no in-passage underline:
// map a snippet of the question stem's added sentence to where it sits in the passage
const INSERT_ANCHORS = {
  'The melody has become so familiar': 'I hear the opening notes of a local folk melody.',
  'A similar musical roadway exists': "Whether the experiment has changed driving habits, I can't say.",
  'This approach also helps preserve delicate collections': 'lets museums rotate collections more efficiently.',
  'best build on the ideas presented': 'community art centers throughout New Mexico.'
};
function readingPos(q){
  const body = (q.passages && q.passages.body) || '';
  const flat = body.replace(/\s+/g,' ');
  if(q.underlined_text){
    const u = q.underlined_text.replace(/\s+/g,' ').trim();
    const i = flat.indexOf(u);
    if(i>=0) return i;
    // insert/placement: try anchor by matching a stem/added-sentence snippet
    for(const key in INSERT_ANCHORS){
      if((q.stem||'').indexOf(key)>=0 || (q.underlined_text||'').indexOf(key)>=0){
        const a = flat.indexOf(INSERT_ANCHORS[key]);
        if(a>=0) return a + INSERT_ANCHORS[key].length + 0.5; // just after the anchor
      }
    }
  }
  return 1e9;   // unknown → end of passage group
}
function orderByReading(qs){
  // keep passages in their existing appearance order; sort questions within each passage by reading position
  const order = [], seen = [];
  qs.forEach(q=>{ const pid=(q.passages&&q.passages.id)||('none-'+q.id); if(!seen.includes(pid)) seen.push(pid); });
  seen.forEach(pid=>{
    const grp = qs.filter(q=>((q.passages&&q.passages.id)||('none-'+q.id))===pid);
    grp.sort((a,b)=>readingPos(a)-readingPos(b));
    order.push(...grp);
  });
  return order;
}
async function startTest(testId){
  if(T && T.timerId){ clearInterval(T.timerId); T.timerId = null; }
  const test = TESTS.find(t=>t.id===testId);
  const timed = document.getElementById('timedBox')?.checked ?? true;
  document.getElementById('v-home').innerHTML = skel(3);
  // (orderByReading + anchors defined below)
  const {data:tq, error} = await db.from('test_questions').select('position, questions(*, passages(id, body))').eq('test_id', testId).order('position');
  if(error || !tq?.length){ alert('Could not load test: '+(error?.message||'no questions')); renderHome(); return; }
  let qs = tq.map(x=>x.questions);
  qs.sort((a,b)=>(a.source_number||0)-(b.source_number||0));   // present in question-number order
  qs.forEach(q=>{ q._num = q.source_number; });                // labels use the real question number
  T = {
    test, timed, questions:qs, cur:0, enteredAt:null, startedAt:Date.now(), startedIso:new Date().toISOString(),
    remaining: Math.round((test.time_limit_sec || qs.length * (PACE[test.section]||45)) * (ME.extra_time ? 1.5 : 1)),
    rec: qs.map((q,i)=>({idx:i, answer:null, changes:[], time:0, conf:null, torn:[]}))
  };
  document.getElementById('secLabel').textContent = '· '+esc(test.name)+(timed?(ME.extra_time?' · timed · +50% time':' · timed'):' · untimed');
  if(timed) T.timerId = setInterval(tick,1000);
  else document.getElementById('timerEl').textContent='∞';
  showQ(0); go('test');
}
function tick(){
  T.remaining--;
  const el = document.getElementById('timerEl');
  el.textContent = fmtT(T.remaining);
  el.classList.toggle('low', T.remaining<120);
  if(T.remaining<=0) finishTest(true);
}
function stampTime(){ if(T.enteredAt!==null){ T.rec[T.cur].time += (Date.now()-T.enteredAt)/1000; } T.enteredAt = Date.now(); }
function showQ(i){
  stampTime(); T.cur=i;
  const q = T.questions[i], r = T.rec[i];
  document.getElementById('qCounter').textContent = 'Question '+(q._num||i+1)+' / '+T.questions.length;
  if(T.timed) document.getElementById('timerEl').textContent = fmtT(T.remaining);
  const lay = document.getElementById('qLayout');
  if(q.passages){
    lay.classList.remove('nopassage'); const pel=document.getElementById('passageEl'); pel.classList.remove('hidden');
    let p = q.passages.body;
    const isHtml = /<(table|div|p)\b/i.test(p);
    if(isHtml){
      pel.classList.add('htmlpassage'); pel.innerHTML = p;
    } else {
      pel.classList.add('htmlpassage');
      // title + paragraphs (prefer blank-line splits; fall back to short-line heuristic)
      let lines = p.split('\n');
      const title = lines[0].trim();
      let paras;
      if(p.indexOf('\n\n')>=0){
        paras = p.split(/\n\s*\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
        paras.shift();  // drop title paragraph
      } else {
        paras = []; let cur=[];
        lines.slice(1).forEach(ln=>{ const t=ln.trim(); if(!t) return; cur.push(t); if(t.length<72){paras.push(cur.join(' ')); cur=[];} });
        if(cur.length) paras.push(cur.join(' '));
      }
      // gather all questions for this passage; number each by its real question number
      const pid = q.passages.id;
      const sibs = T.questions.filter(x=>x.passages && x.passages.id===pid);
      function anchorFor(x){   // returns the passage snippet an insert/placement question sits after
        for(const key in INSERT_ANCHORS){
          if((x.stem||'').indexOf(key)>=0 || (x.underlined_text||'').indexOf(key)>=0) return INSERT_ANCHORS[key];
        }
        return null;
      }
      function renderPara(text){
        const norm = text.replace(/\s+/g,' ');
        const hits = [];
        sibs.forEach(x=>{
          const u = x.underlined_text ? x.underlined_text.replace(/\s+/g,' ').trim() : '';
          let at = u ? norm.indexOf(u) : -1;
          if(at>=0 && u.length>1){
            hits.push({at, len:u.length, num:x._num, active:x===q, mark:false});
          } else {
            const a = anchorFor(x);
            if(a){ const ai = norm.indexOf(a); if(ai>=0) hits.push({at:ai+a.length, len:0, num:x._num, active:x===q, mark:true}); }
          }
        });
        hits.sort((a,b)=>a.at-b.at || a.len-b.len);
        let out='', pos=0;
        hits.forEach(h=>{ if(h.at<pos) return;
          out += esc(norm.slice(pos,h.at));
          if(h.mark){
            out += '<sup class="uq'+(h.active?' uq-active':'')+'">'+h.num+'</sup>';
          } else {
            out += '<u class="ul'+(h.active?' ul-active':'')+'">'+esc(norm.slice(h.at,h.at+h.len))+'</u><sup class="uq'+(h.active?' uq-active':'')+'">'+h.num+'</sup>';
          }
          pos = h.at+h.len;
        });
        out += esc(norm.slice(pos));
        return '<p>'+out+'</p>';
      }
      pel.innerHTML = '<div class="ptitle">'+esc(title)+'</div>'+paras.map(renderPara).join('');
    }
  } else { lay.classList.add('nopassage'); document.getElementById('passageEl').classList.add('hidden'); }
  let stem = /<(table|div)\b/i.test(q.stem) ? q.stem : esc(q.stem).replace(/\\n/g,'<br>');
  if(q.underlined_text && !q.passages) stem = '<span class="underlined">'+esc(q.underlined_text)+'</span><br><br>'+stem;
  if(q.image_url) stem = '<img src="'+esc(q.image_url)+'" style="max-width:100%;border-radius:8px;margin-bottom:10px"><br>'+stem;
  document.getElementById('stemEl').innerHTML = stem;
  document.getElementById('choicesEl').innerHTML = LETTERS.map(L=>
    '<div class="choice'+(r.answer===L?' sel':'')+'" onclick="pick(\''+L+'\')"><span class="ltr">'+L+'</span><span>'+chText(q['answer_'+L.toLowerCase()])+'</span></div>').join('');
  document.getElementById('confChips').innerHTML = [1,2,3,4,5].map(c=>
    '<button class="confchip'+(r.conf===c?' sel':'')+'" onclick="setConf('+c+')">'+c+'</button>').join(' ');
  document.getElementById('tornChips').innerHTML = LETTERS.map(L=>
    '<button class="tornchip'+(r.torn.includes(L)?' sel':'')+'" onclick="toggleTorn(\''+L+'\')">'+L+'</button>').join(' ');
  document.getElementById('nextBtn').textContent = i===T.questions.length-1 ? 'Finish ✓' : 'Next →';
  document.getElementById('paletteEl').innerHTML = T.rec.map((rr,j)=>
    '<button class="pq'+(rr.answer?' done':'')+(j===i?' cur':'')+'" onclick="showQ('+j+')">'+(T.questions[j]._num||j+1)+'</button>').join('');
}
function refresh(){ const e=T.enteredAt; showQ(T.cur); T.enteredAt=e; }
function pick(L){
  const r = T.rec[T.cur];
  if(r.answer!==L){ if(r.answer!==null) r.changes.push({from:r.answer,to:L,at:Date.now()-T.startedAt}); r.answer=L; }
  refresh();
}
function setConf(c){ T.rec[T.cur].conf=c; refresh(); }
function toggleTorn(L){
  const r=T.rec[T.cur];
  if(r.torn.includes(L)) r.torn=r.torn.filter(x=>x!==L);
  else { r.torn.push(L); if(r.torn.length>2) r.torn.shift(); }
  refresh();
}
function nav(d){
  const r=T.rec[T.cur];
  if(d>0 && r.answer && r.conf===null) r.conf=3;
  const n=T.cur+d;
  if(n>=T.questions.length){ finishTest(false); return; }
  if(n>=0) showQ(n);
}

// ---------- DIAGNOSTIC ENGINE ----------
function classifyMiss(q, r, ctx){
  const avg = ctx.avgSec, t = r.time, conf = r.conf ?? 3;
  const diff = Number(q.difficulty||3);
  const posFrac = ctx.pos/ctx.total;
  const distr = r.answer ? (q['distractor_'+r.answer.toLowerCase()+'_type']||'') : '';
  const distrReason = r.answer ? (q['distractor_'+r.answer.toLowerCase()+'_reason']||'') : '';
  const tornHadCorrect = r.torn.length>0 && r.torn.includes(q.correct_choice);
  const wasRightThenChanged = r.changes.some(c=>c.from===q.correct_choice);
  if(Math.round(t)===0){
    if(r.answer===null) return {type:"Didn't Read", reason:'Viewed for 0 seconds and left blank — this question was never read.'};
    return {type:"Didn't Read", reason:'Answered after viewing for 0 seconds — this question was never actually read.'};
  }
  if(r.answer===null){
    if(ctx.timeExpired && posFrac>0.6) return {type:'Timing', reason:'Never reached / left blank — ran out of time near the end of the section.'};
    return {type:'Timing', reason:'Left blank. There is no penalty for guessing — never leave a question blank.'};
  }
  if(wasRightThenChanged) return {type:'Confidence', reason:'Had the correct answer ('+q.correct_choice+') selected, then changed it. First instinct was right.'};
  if(tornHadCorrect) return {type:'Confidence', reason:'Was torn between two answers and one was correct ('+q.correct_choice+'). The knowledge was there; the trust wasn’t.'};
  if(ctx.timeExpired && posFrac>0.75 && t < avg*0.4) return {type:'Timing', reason:'Rushed answer ('+Math.round(t)+'s vs ~'+avg+'s expected) in the final stretch of a timed section.'};
  if(conf<=2) return {type:'Guess', reason:'Low self-reported confidence ('+conf+'/5)'+(r.torn.length?' while torn between '+r.torn.join(' & '):'')+' — effectively a guess. Signals a content gap to build from scratch.'};
  if(t > avg*2.2) return {type:'Timing', reason:'Spent '+Math.round(t)+'s (~'+(t/avg).toFixed(1)+'× the expected '+avg+'s). Over-investing steals time from easier points later. Likely also a partial content gap.'};
  if(conf>=4 && diff<=3 && t < avg*0.65) return {type:'Careless', reason:'High confidence ('+conf+'/5), easy question (difficulty '+diff+'), answered fast ('+Math.round(t)+'s vs ~'+avg+'s expected). A rushing error, not a knowledge gap.'};
  let why = 'Normal pace and moderate-to-high confidence but wrong — points to a genuine content gap in '+(q.skill||'this skill')+'.';
  if(distr && distr!=='correct' && !/junk/i.test(distr)) why += ' Fell for the "'+distr.replace(/_/g,' ')+'" trap: '+distrReason;
  else if(distrReason) why += ' ('+distrReason+')';
  return {type:'Content', reason:why};
}
function scaleScore(p){
  const pts=[[0,1],[.15,10],[.25,13],[.35,16],[.45,18],[.55,20],[.65,22],[.72,24],[.8,27],[.87,29],[.92,31],[.96,33],[.99,35],[1,36]];
  for(let i=1;i<pts.length;i++){ if(p<=pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return Math.round(y0+(y1-y0)*(p-x0)/(x1-x0)); } }
  return 36;
}
function analyze(T, timeExpired){
  const avgSec = PACE[T.test.section]||45;
  const total = T.questions.length;
  const results = T.questions.map((q,i)=>{
    const r = T.rec[i];
    const correct = r.answer===q.correct_choice;
    let miss=null;
    if(!correct) miss = classifyMiss(q, r, {avgSec, pos:i+1, total, timeExpired});
    const fragile = correct && ((r.conf!=null && r.conf<=2) || r.torn.length>0);
    return {i, qid:q.id, skill:q.skill, sub_skill:q.sub_skill, difficulty:Number(q.difficulty||3),
      correct, answer:r.answer, correctChoice:q.correct_choice, time:Math.round(r.time*10)/10,
      conf:r.conf, torn:r.torn.slice(), changes:r.changes, miss, fragile, stem:q.stem,
      tag: r.answer&&!correct ? (q['distractor_'+r.answer.toLowerCase()+'_type']||'') : '',
      distractorReason: r.answer&&!correct ? (q['distractor_'+r.answer.toLowerCase()+'_reason']||'') : ''};
  });
  const nCorrect = results.filter(x=>x.correct).length;
  const skills = {};
  results.forEach(x=>{
    const k = x.skill||'other';
    skills[k] = skills[k]||{total:0,correct:0,fragile:0,misses:[],types:{}};
    skills[k].total++;
    if(x.correct){ skills[k].correct++; if(x.fragile) skills[k].fragile++; }
    else { skills[k].misses.push(x); skills[k].types[x.miss.type]=(skills[k].types[x.miss.type]||0)+1; }
  });
  Object.values(skills).forEach(s=>{ s.mastery = Math.round(100*(s.correct - s.fragile*0.5)/s.total); });
  const missTypes = {};
  results.filter(x=>!x.correct).forEach(x=>missTypes[x.miss.type]=(missTypes[x.miss.type]||0)+1);
  const cur = scaleScore(nCorrect/total);
  const recovery = {Content:.8, Careless:.65, Confidence:.6, Timing:.55, Guess:.4, "Didn't Read":.85};
  let recovered = 0;
  results.filter(x=>!x.correct).forEach(x=>recovered += recovery[x.miss.type]||.5);
  const pred = scaleScore(Math.min(1,(nCorrect+recovered)/total));
  const plan = buildPlan(skills, missTypes, avgSec);
  return {nCorrect, total, curScore:cur, predScore:pred, missTypes, skills, results, plan,
          totalTime: Math.round(results.reduce((a,x)=>a+x.time,0))};
}
// ===== Priority ranker: wrongness × ACT-frequency × fixability =====
// Approx questions per real ACT test by topic/skill (from ACT domain weights + our audit).
// Keys cover both the 43 remediation topics AND the broader test-question skill names.
const ACT_FREQ = {
  // English (50q)
  commas:7, transitions:4.5, conciseness:4.5, add_delete_relevance:4.5, fragments_runons:3.5,
  subject_verb_agreement:2.5, verb_tense_form:2.5, pronouns:2.5, modifiers:2, parallel_structure:2,
  apostrophes:2, semicolons_colons:2.5, word_choice:2.5, organization:2.5, tone_style:2,
  punctuation:8, grammar:6, grammar_agreement:6, sentence_structure:4, transitions_flow:4.5,
  conciseness_precision:4.5, organization_placement:2.5,
  // Math (45q)
  linear_equations:5.5, expressions_word_problems:4.5, ratios_proportions:4, percents_rates:3,
  quadratics:2.5, exponents_radicals:2.5, function_notation:2.5, triangles:2.5, coordinate_geometry:2.5,
  area_perimeter_volume:2.5, statistics:2, angles_lines:2, circles:1.5, trigonometry:2, sequences:1.5,
  number_theory:1.5, inequalities:1.5, graph_transformations:1, probability:1.5, complex_matrices_sets:1,
  algebra:8, geometry:6, geometry_trig:6, functions_sequences:4, number_operations:3,
  probability_statistics:3, ratios_rates:4,
  // Science (40q)
  reading_data:15, trends_predictions:7, comparing_combining:7, experimental_design:5,
  evaluating_claims:4, scientific_math:3, outside_knowledge:3, data_interpretation:15, trends_extrapolation:7
};
function freqOf(skill){
  const k = String(skill||'').toLowerCase().replace(/\s+/g,'_');
  if(ACT_FREQ[k]!=null) return ACT_FREQ[k];
  for(const key in ACT_FREQ){ if(k.includes(key) || key.includes(k)) return ACT_FREQ[key]; }
  return 2; // neutral default
}
// How fast points come back, by the skill's dominant miss type.
const FIXABILITY = {"Didn't Read":1.0, Careless:0.9, Timing:0.8, Confidence:0.75, Guess:0.55, Content:0.6};
function rankPriorities(skills){
  const arr = Object.entries(skills).map(([k,s])=>{
    const misses = s.misses.length;
    const wrongness = misses + s.fragile*0.5;               // how much is broken here
    if(wrongness<=0) return null;
    const domEntry = Object.entries(s.types||{}).sort((a,b)=>b[1]-a[1])[0];
    const domMiss = domEntry ? domEntry[0] : null;
    const fixability = domMiss ? (FIXABILITY[domMiss]||0.6) : 0.6;
    const freq = freqOf(k);
    const priority = wrongness * (freq/2) * fixability;      // core formula
    const recoverable = wrongness * fixability;              // ~questions likely to flip correct
    const estPoints = +(recoverable * (freq>=4?0.28:0.18)).toFixed(2);
    return {skill:k, misses, fragile:s.fragile, mastery:s.mastery, freq, fixability, domMiss,
            priority:+priority.toFixed(2), estPoints};
  }).filter(Boolean);
  arr.sort((a,b)=>b.priority-a.priority);
  return arr;
}
function buildPlan(skills, missTypes, avgSec){
  const steps = [];
  const HABIT = {
    Careless:'Careless protocol: on easy questions, re-read the stem once and say what is being asked before answering.',
    Confidence:'Answer-changing rule: only switch when you can name the specific error in your first choice \u2014 a named reason, not a feeling.',
    Timing:'Pacing: know your checkpoint question at each quarter of the clock. Stuck past 90 seconds \u2014 best answer, flag it, move on. Never leave blanks.',
    Guess:'Guessed topics are untaught topics \u2014 they get instruction first, practice second.',
    "Didn't Read":'Unread questions are free points lost. Even when time is short, open every question, read the stem, and make your best elimination guess \u2014 never skip past one at 0 seconds.'
  };
  const habits = Object.entries(missTypes).filter(([ty,n])=>n>=2 && HABIT[ty]).sort((a,b)=>b[1]-a[1]);
  if(habits.length){
    steps.push({kind:'habit', title:'Test-taking habits \u2014 '+habits.map(([ty,n])=>ty+' \u00d7'+n).join(', '),
      desc: habits.map(([ty])=>HABIT[ty]).join(' ')});
  }
  const priorities = rankPriorities(skills);
  const ranked = priorities.slice(0,8).map(pr=>({k:pr.skill, s:skills[pr.skill], pr}));
  ranked.forEach(({k,s,pr})=>{
    const parts = [];
    if(pr && pr.freq>=4) parts.push('High-value target: this skill shows up ~'+Math.round(pr.freq)+'× on a real ACT, so fixing it moves your score the most.');
    const tagCount = {};
    s.misses.forEach(m=>{
      if(m.tag && m.tag!=='junk' && m.tag!=='correct'){
        if(!tagCount[m.tag]) tagCount[m.tag]={n:0, reason:m.distractorReason||''};
        tagCount[m.tag].n++;
      }
    });
    const recurring = Object.entries(tagCount).filter(([,v])=>v.n>=2);
    if(recurring.length){
      recurring.forEach(([tag,v])=>parts.push('You fell for the \u201c'+tag.replace(/_/g,' ')+'\u201d trap '+v.n+'\u00d7'+(v.reason?' \u2014 '+v.reason:'')+'.'));
    } else {
      const first = Object.entries(tagCount)[0];
      if(first && first[1].reason) parts.push('Trap you fell for: \u201c'+first[0].replace(/_/g,' ')+'\u201d \u2014 '+first[1].reason);
    }
    const p = PRESC[k];
    if(p){ parts.push(p.teach); if(p.drill) parts.push('Drill: '+p.drill); }
    else parts.push('Review this skill with your tutor, then do 10 targeted practice questions.');
    parts.push('Re-do your misses: '+s.misses.map(m=>'Q'+(m.i+1)).join(', ')+'.');
    if(s.fragile) parts.push('Also '+s.fragile+' correct-but-shaky answer'+(s.fragile>1?'s':'')+' here \u2014 this skill is not locked in yet.');
    steps.push({kind:'content', skill:k, title:'Fix: '+k.replace(/_/g,' ')+' ('+s.correct+'/'+s.total+' correct)', desc: parts.join(' ')});
  });
  if(steps.length) steps.push({kind:'habit', title:'Lock it in \u2014 retest',
    desc:'Within 7\u201310 days of finishing the steps above, retake a fresh form of this section. The predicted score on your dashboard assumes this plan is completed.'});
  return steps;
}
// ---------- FINISH & SAVE ----------
async function finishTest(timeExpired){
  if(T.submitting) return;              // guard: block double-submit
  const answered = T.rec.filter(r=>r.answer!==null).length;
  if(!timeExpired && answered===0){
    if(!confirm('You have not answered any questions yet. Submit a blank test anyway?')) return;
  }
  T.submitting = true;
  stampTime(); T.enteredAt=null;
  if(T.timerId) clearInterval(T.timerId);
  const a = analyze(T, timeExpired);
  document.getElementById('v-test').classList.add('hidden');
  document.getElementById('v-results').classList.remove('hidden');
  document.getElementById('v-results').innerHTML = '<div class="loading">Scoring and saving your results…</div>';
  try{
    const {data:sess, error:e1} = await db.from('sessions').insert({
      student_id:ME.id, test_id:T.test.id, timed:T.timed, started_at:T.startedIso,
      finished_at:new Date().toISOString(), raw_correct:a.nCorrect, raw_total:a.total,
      est_score:a.curScore, predicted_score:a.predScore
    }).select().single();
    if(e1) throw e1;
    const respRows = a.results.map((x,i)=>({
      session_id:sess.id, question_id:x.qid, position:i+1, answer:x.answer, correct:x.correct,
      time_spent_sec:x.time, confidence:x.conf, torn_between:x.torn, change_log:x.changes,
      miss_type:x.miss?x.miss.type:null, miss_reason:x.miss?x.miss.reason:null, fragile:x.fragile
    }));
    const {error:e2} = await db.from('responses').insert(respRows);
    if(e2) throw e2;
    const mastRows = Object.entries(a.skills).map(([k,s])=>({
      student_id:ME.id, session_id:sess.id, section:T.test.section, skill:k,
      mastery:s.mastery, correct:s.correct, total:s.total
    }));
    await db.from('mastery_snapshots').insert(mastRows);
    const {data:plan} = await db.from('study_plans').insert({session_id:sess.id, student_id:ME.id}).select().single();
    if(plan) await db.from('plan_steps').insert(a.plan.map((p,i)=>({plan_id:plan.id, position:i+1, kind:p.kind, title:p.title, description:p.desc, skill:p.skill||null})));
    renderReport(a, {name:T.test.name, student:ME.full_name||ME.email});
  }catch(e){
    renderReport(a, {name:T.test.name, student:ME.full_name||ME.email});
    document.getElementById('v-results').insertAdjacentHTML('afterbegin',
      '<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Results shown but NOT saved:</b> <span class="dim">'+esc(e.message||e)+'</span></div>');
  }
}

// ---------- REPORT RENDER (live or from DB) ----------
function renderReport(a, meta){
  const mt = Object.entries(a.missTypes).sort((x,y)=>y[1]-x[1]);
  const skillRows = Object.entries(a.skills).sort((x,y)=>x[1].mastery-y[1].mastery).map(([k,v])=>{
    const col = v.mastery>=80?'var(--good)':v.mastery>=50?'var(--warn)':'var(--bad)';
    return '<tr><td><b>'+esc(k.replace(/_/g,' '))+'</b></td><td>'+v.correct+'/'+v.total+(v.fragile?' <span class="dim">('+v.fragile+' shaky)</span>':'')+'</td>'+
      '<td><div class="bar"><i style="width:'+Math.max(3,v.mastery)+'%;background:'+col+'"></i></div></td><td><b style="color:'+col+'">'+v.mastery+'%</b></td>'+
      '<td>'+Object.entries(v.types).map(([t,n])=>'<span class="pill '+PILL[t]+'">'+t+' ×'+n+'</span>').join(' ')+'</td></tr>';
  }).join('');
  const missCards = a.results.filter(x=>!x.correct).map(x=>
    '<details><summary><span>Q'+(x.i+1)+' · '+esc((x.skill||'').replace(/_/g,' '))+'</span><span class="pill '+PILL[x.miss.type]+'">'+x.miss.type+' Miss</span></summary>'+
    '<div class="detbody"><p style="margin-bottom:8px">'+esc((x.stem||'').slice(0,220))+'…</p>'+
    '<p><b>Answer:</b> '+(x.answer||'blank')+' · <b>Correct:</b> '+x.correctChoice+' · <b>Time:</b> '+x.time+'s · <b>Confidence:</b> '+(x.conf??'—')+'/5'+(x.torn.length?' · torn: '+x.torn.join('&'):'')+((x.changes?.length)?' · changed ×'+x.changes.length:'')+'</p>'+
    '<p style="margin-top:8px;color:var(--cyan)"><b>Diagnosis:</b> '+esc(x.miss.reason)+'</p></div></details>').join('')
    || '<p class="dim">No misses. Perfect section! 🎉</p>';
  const planHtml = a.plan.map((p,i)=>{ const sk=planSkill(p); return '<div class="planstep"><div class="n">'+(i+1)+'</div><div><b>'+esc(p.title)+'</b><p class="dim" style="margin-top:4px">'+esc(p.desc)+'</p>'+(sk?modeBtns(sk, p):'')+'</div></div>'; }).join('');
  document.getElementById('v-results').innerHTML =
  '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+esc(meta.student)+' — '+esc(meta.name)+'</h2><span class="row"><button class="btn2" onclick="window.print()">Print report</button><button class="btn2" onclick="renderHome().then(()=>go(\'home\'))">Back to dashboard</button></span></div>'+
  '<div class="statgrid" style="margin-top:16px">'+
    '<div class="stat"><div class="v">'+a.nCorrect+'/'+a.total+'</div><div class="l">Raw score</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--acc)" id="cuScore">0</div><div class="l">Est. ACT score</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--good)" id="cuPred">0</div><div class="l">Predicted after plan</div></div>'+
    '<div class="stat"><div class="v">'+fmtT(a.totalTime)+'</div><div class="l">Total time</div></div>'+
  '</div>'+

async function startConceptPractice(conceptNo, skillKey, mode, subRecipe, section){
  section = section || 'math';
  const T_ITEMS = section === 'english' ? 'english_items' : 'math_items';
  const T_RECIPES = section === 'english' ? 'english_recipes' : 'math_recipes';
  let items = null;
  try{
    const {data} = await db.from(T_ITEMS).select('*').eq('concept_no', conceptNo).eq('is_servable', true);
    items = data;
  }catch(_){ items = null; }
  if(!items || !items.length) return false;
  let label = skillKey;
  try{
    const {data:r} = await db.from(T_RECIPES).select('concept_name').eq('concept_no', conceptNo).limit(1).maybeSingle();
    if(r && r.concept_name) label = r.concept_name;
  }catch(_){}
  // sub-bank picker: grouped topics (e.g. all shifts together), or everything
  if(SUBBANKS[conceptNo] && subRecipe === undefined){
    const groups = SUBBANKS[conceptNo];
    const el = document.getElementById('v-practice');
    el.innerHTML = '<div class="card"><h2>' + esc(label) + '</h2>'
      + '<p class="dim">Pick a question bank to work on:</p>'
      + '<select id="subbank" style="padding:10px 12px;margin:12px 0;border-radius:8px;min-width:260px;font-size:15px">'
      + '<option value="">All types (mixed)</option>'
      + groups.map(g=>'<option value="' + esc(g.recipes.join(',')) + '">' + esc(g.label) + '</option>').join('')
      + '</select>'
      + '<div class="row" style="gap:8px"><button class="btn" onclick="startConceptPractice(' + conceptNo
      + ', \'' + esc(skillKey) + '\', \'' + esc(mode) + '\', document.getElementById(\'subbank\').value)">Start practice</button>'
      + '<button class="btn2" onclick="renderHome().then(()=>go(\'home\'))">Back to dashboard</button></div></div>';
    return true;
  }
  if(subRecipe){
    const allow = subRecipe.split(',');
    items = items.filter(it=>allow.indexOf(it.recipe_id) !== -1);
    if(!items.length) return false;
  }
  // surface cycle: deal one question from each surface (recipe_id) per round,
  // in random order within the round — question types alternate instead of
  // clumping. Concept 15 re-deals below by figure kind instead.
  let pool;
  {
    const bySurf = {};
    items.forEach(it=>{ (bySurf[it.recipe_id] = bySurf[it.recipe_id]||[]).push(it); });
    // every round contains each type exactly once; the ORDER inside each
    // round reshuffles (ABCD, DCBA, BDAC, ...) so students must diagnose
    // the type before solving — interleaving, with guaranteed coverage.
    // Even sub-forms: a surface usually holds two variants (e.g. 15 rays and 15
    // segments). A blind shuffle lets one variant cluster, so instead shuffle
    // each variant separately and round-robin them. Items tag their variant as
    // art_payload.fold; untagged items fall back to a plain shuffle.
    const foldOf = it => { const p = it && it.art_payload; return (p && p.fold) || null; };
    const headOf = s => { const i = String(s || '').indexOf('\u00b7');
                          return i < 0 ? String(s || '') : s.slice(0, i).trim(); };
    const tailOf = s => { const i = String(s || '').lastIndexOf('\u00b7');
                          return i < 0 ? '' : s.slice(i + 1).trim(); };
    function stratify(g, lead){
      const by = {}, order = [];
      g.forEach(it=>{ const f = foldOf(it) || '_'; if(!by[f]){ by[f] = []; order.push(f); } by[f].push(it); });
      if(order.length < 2) return g.sort(()=>Math.random()-0.5);
      order.forEach(k=>by[k].sort(()=>Math.random()-0.5));
      // UNEQUAL folds (English's 5/11 works/fails) cannot use the round-robin
      // below: one-per-fold-per-round over-samples the small folds, and a
      // simulated first ten came out 50% NO-CHANGE-correct on a bank built to
      // be 31%. Deal them PROPORTIONALLY instead — each item gets a jittered
      // position scaled by its fold's share, so a fold with 5 of 32 items
      // supplies ~5 of every 32 dealt, from the first question on, without a
      // predictable every-third-item rhythm a student could exploit. Equal
      // folds (every math concept) keep the exact weave below, untouched.
      const sizes = order.map(k=>by[k].length);
      if(Math.min.apply(null, sizes) !== Math.max.apply(null, sizes)){
        const paced = [];
        order.forEach(k=>{
          const n = by[k].length;
          by[k].forEach((it, j)=>paced.push([ (j + Math.random()) * g.length / n, it ]));
        });
        paced.sort((a,b)=>a[0]-b[0]);
        return paced.map(p=>p[1]);
      }
      order.sort(()=>Math.random()-0.5);          // which variant leads varies by session
      // A fold tag may carry TWO dimensions, written "sub-form \u00b7 presentation".
      // Walk the fold grid diagonally so consecutive folds differ on BOTH — a
      // plain interleave alternates the presentation but lets the first two
      // items of a surface land on the same sub-form, which shows up in any
      // ten-question run. Tags without a "\u00b7" are untouched, so older
      // concepts behave exactly as before.
      const tails = [], heads = [];
      order.forEach(k=>{
        const t = tailOf(k); if(tails.indexOf(t) < 0) tails.push(t);
        const h = headOf(k); if(heads.indexOf(h) < 0) heads.push(h);
      });
      // The caller may pin which presentation this surface LEADS with. Each
      // surface alternates on its own already; what it cannot know alone is
      // what the other four are doing, so a run can still come out five of one
      // kind then five of the other. Pinning the leads makes the whole round
      // predictable, which is what lets the round builder below alternate
      // question by question.
      if(lead && tails.length === 2 && tails[0] !== lead) tails.reverse();
      if(tails.length > 1){
        const woven = [];
        if(heads.length > 1 && order.length === tails.length * heads.length){
          for(let k = 0; k < order.length; k++){
            const t = k % tails.length;
            const h = (Math.floor(k / tails.length) + t) % heads.length;
            const f = order.find(x => headOf(x) === heads[h] && tailOf(x) === tails[t]);
            if(f && woven.indexOf(f) < 0) woven.push(f);
          }
        } else {
          const buckets = tails.map(t => order.filter(k => tailOf(k) === t));
          for(let i2 = 0; woven.length < order.length; i2++){
            let placed = false;
            buckets.forEach(b => { if(i2 < b.length){ woven.push(b[i2]); placed = true; } });
            if(!placed) break;
          }
        }
        order.forEach(k=>{ if(woven.indexOf(k) < 0) woven.push(k); });
        order.length = 0; woven.forEach(k=>order.push(k));
      }
      const out = [];
      for(let i=0; out.length < g.length; i++){
        let placed = false;
        for(const k of order){ if(i < by[k].length){ out.push(by[k][i]); placed = true; } }
        if(!placed) break;
      }
      return out;
    }
    // STRICT ALTERNATION of the presentation dimension. Where the second half
    // of the fold is what the item LOOKS like — a histogram or the same data
    // written out, a figure on a grid or the same ellipse in symbols — a
    // student should meet them one and one. Simulated over 4000 sessions the
    // plain round-robin flipped presentation on only 51% of consecutive
    // questions and served five of a kind in a row in 11% of ten-question sets.
    //
    // THIS ONLY APPLIES WHEN THE TAIL IS REALLY PRESENTATIONAL, and the test is
    // structural rather than by name: the tail has to decide whether the item
    // carries a figure. That distinction matters. On concept 70 the second
    // dimension is "the mean holds still / the mean moves" — a CONCEPTUAL fold
    // that is frequently the answer itself, and strictly alternating it would
    // hand the answer to anyone who noticed the pattern. Concepts like that
    // fail the test and are left exactly as they were.
    const hasArt = it => { const p = it && it.art_payload;
                           return (p && (p.kind || p.type)) ? '1' : '0'; };
    let ALT = null, LEADS = null;
    {
      const seen = {};
      let tagged = true;
      items.forEach(it=>{
        const f = foldOf(it);
        if(!f || f.indexOf('\u00b7') < 0){ tagged = false; return; }
        const t = tailOf(f);
        (seen[t] = seen[t] || {})[hasArt(it)] = 1;
      });
      const ts = Object.keys(seen);
      if(tagged && ts.length === 2
         && Object.keys(seen[ts[0]]).length === 1
         && Object.keys(seen[ts[1]]).length === 1
         && Object.keys(seen[ts[0]])[0] !== Object.keys(seen[ts[1]])[0])
        ALT = (Math.random() < 0.5) ? [ts[0], ts[1]] : [ts[1], ts[0]];
    }
    const surfKeys = Object.keys(bySurf);
    if(ALT){
      // half the surfaces lead with one presentation and half with the other,
      // so each round of five arrives already three-and-two rather than
      // whatever five independent coin flips happened to give
      const shuffled = surfKeys.slice().sort(()=>Math.random()-0.5);
      LEADS = {};
      shuffled.forEach((k, i)=>{
        LEADS[k] = (i < Math.ceil(shuffled.length / 2)) ? ALT[0] : ALT[1]; });
    }
    const groups = surfKeys.map(k=>stratify(bySurf[k], LEADS ? LEADS[k] : null));
    // Scenario spacing: items may tag their scenario as art_payload.ctx (e.g. the
    // cats-and-dogs table). Two items sharing a ctx should not land close
    // together, even when they come from different surfaces. Items with no ctx
    // tag are unaffected.
    const ctxOf = it => { const p = it && it.art_payload; return (p && p.ctx) || null; };
    const CTX_WINDOW = 22;   // tuned: minimises repeats inside any 10-question span
    const recent = [];
    const seenRecently = c => c && recent.indexOf(c) !== -1;
    const mixed = [];
    for(let i=0; groups.some(g=>i<g.length); i++){
      const live = groups.filter(g=>i<g.length);
      const round = live.map(g=>g[i]);
      round.sort(()=>Math.random()-0.5);
      // for any item whose scenario is still fresh in memory, try to swap it
      // with a later item from its own surface that uses a different scenario
      for(let k=0; k<round.length; k++){
        const c = ctxOf(round[k]);
        if(!c) continue;
        const clash = seenRecently(c) ||
          round.slice(0, k).some(o=>ctxOf(o) === c);
        if(!clash) continue;
        const g = live.find(gr=>gr.indexOf(round[k]) !== -1);
        if(!g) continue;
const myFold = foldOf(round[k]);
        // Only ever swap WITHIN a fold, never across one. A cross-fold fallback
        // fixes one scenario repeat at the cost of unbalancing the folds, and
        // over a long run that drift is the more visible problem: simulated over
        // 2000 sessions, same-fold-only holds every fold exactly even through 40
        // questions, where the fallback held it in a third of runs. Concepts
        // whose items carry no fold tag are unaffected — foldOf is null for all
        // of them, so every candidate still counts as the same fold.
        let swapAt = -1;
        for(let j=i+1; j<g.length; j++){
          const alt = ctxOf(g[j]);
          if(alt && (seenRecently(alt) || round.some(o=>ctxOf(o) === alt))) continue;
          if(foldOf(g[j]) === myFold){ swapAt = j; break; }
        }
        if(swapAt !== -1){
          const at = g.indexOf(round[k]);
          const tmp = g[at]; g[at] = g[swapAt]; g[swapAt] = tmp;
          round[k] = g[at];
        }
      }
      // deal the round out alternating, picking up the beat where the previous
      // round left off — position 0 of the whole run takes ALT[0], and every
      // question after it flips. Composition is untouched; only the order in
      // which this round's items are handed over changes.
      if(ALT){
        const bin = {}; bin[ALT[0]] = []; bin[ALT[1]] = [];
        round.forEach(it=>{ const t = tailOf(foldOf(it));
                            (bin[t] = bin[t] || []).push(it); });
        const seq = [];
        let want = (mixed.length % 2 === 0) ? ALT[0] : ALT[1];
        while(seq.length < round.length){
          const other = (want === ALT[0]) ? ALT[1] : ALT[0];
          const take = (bin[want] && bin[want].length) ? want : other;
          if(!bin[take] || !bin[take].length) break;
          seq.push(bin[take].shift());
          want = (take === ALT[0]) ? ALT[1] : ALT[0];
        }
        if(seq.length === round.length){ round.length = 0; seq.forEach(x=>round.push(x)); }
      }
      round.forEach(it=>{
        const c = ctxOf(it);
        if(c){ recent.push(c); while(recent.length > CTX_WINDOW) recent.shift(); }
      });
      mixed.push(...round);
    }
    pool = mixed.map(it=>adaptMathItem(it, label));
  }
  // concept 19: fixed rotation — word (circle) → endpoint → grid graph → number
  // line, repeating in that exact order. Random only within each type.
  if(conceptNo === 19){
    const ORDER = ['R03D', 'R03B', 'R03A', 'R03C'];
    const by19 = {};
    items.forEach(it=>{ (by19[it.recipe_id] = by19[it.recipe_id]||[]).push(it); });
    const gs = ORDER.map(r=>(by19[r]||[]).sort(()=>Math.random()-0.5));
    const seq = [];
    for(let i=0; gs.some(g=>i<g.length); i++)
      for(const g of gs) if(i<g.length) seq.push(g[i]);
    pool = seq.map(it=>adaptMathItem(it, label));
  }
  // concept 15 only: draw evenly from the two figure kinds (rect / box) so a
  // 10-question session is always 5 of each, in random order. Other concepts
  // are untouched.
  if(conceptNo === 15){
    const kindOf = q => (q.art_payload && (q.art_payload.kind || q.art_payload.type)) || 'none';
    const rects = pool.filter(q=>kindOf(q)==='rect'), boxes = pool.filter(q=>kindOf(q)==='box'),
          rest = pool.filter(q=>kindOf(q)!=='rect' && kindOf(q)!=='box');
    const mixed = [];
    for(let i=0; i<Math.max(rects.length, boxes.length); i++){
      const pair = Math.random() < 0.5 ? [rects[i], boxes[i]] : [boxes[i], rects[i]];
      pair.forEach(q=>{ if(q) mixed.push(q); });
    }
    pool = mixed.concat(rest);
  }
  let sessionId = null;
  try{
    const {data:sess} = await db.from('practice_sessions').insert({student_id:ME.id, skill:label, total:Math.min(10,pool.length)}).select().single();
    sessionId = sess ? sess.id : null;
  }catch(_){}
  const target = mode==='careless' ? Math.min(6, pool.length) : Math.min(10, pool.length);
  PR = {skill:skillKey, skillLabel:label, mode, pool, idx:0, target, rec:[], cur:null, curAnswer:null, pending:null, awaitConf:false, streak:0, best:0, qLimit:0, qRemaining:0, qTimerId:null, sessionId, newBank:true, section};
  advancePQ();
  return true;
}

function chText(v){
  const t = String(v == null ? '' : v);
  // a matrix answer arrives as real newlines and starts with a bracket: keep
  // the breaks and set it monospace so the columns line up under each other
  if (t.charAt(0) === '[' && t.indexOf('\n') >= 0)
    return '<span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;line-height:1.35;display:inline-block">'
      + esc(t) + '</span>';
  // legacy items store the two characters backslash-n as a line break
  return esc(t).replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
}

      'All four are fine grammar. Nobody is testing your commas here. The stem names the job \u2014 SOUND \u2014 and you hire the one choice that does that exact job.',

      'B tells you there WAS noise \u2014 "quite a racket" \u2014 but not one thing you could actually hear. Naming the category is not delivering it.',

      'C gives you clanking and hissing \u2014 noises. That is the only choice where sound actually reaches your ear. The answer is C.',

    check: 'The trap on every one of these is the choice that sounds nicest instead of the one that does the named job \u2014 that is exactly how you land on J. There is always one pretty, vague option sitting there waiting. Read the stem like a hiring notice: it names the welder it wants. Concrete beats elegant, every single time.'
  },
  e2: {
    label: 'Show a worked example',
    title: '"Which choice makes the sentence most grammatically acceptable?" \u2014 Sea otters wrap themselves in [kelp, the] long ribbons keep them from drifting while they sleep.',
    steps: [
      'A. NO CHANGE \u00b7 B. kelp; the \u00b7 C. kelp the \u00b7 D. kelp; and the',
      'First job on every boundary question: read each side of the punctuation and ask whether it could stand alone as its own sentence. "Sea otters wrap themselves in kelp" \u2014 stands. "The long ribbons keep them from drifting while they sleep" \u2014 stands.',
      'Two sentences that both stand cannot be held by a comma \u2014 a comma is thread. NO CHANGE is a comma splice.',
      'C crashes them together with nothing at all \u2014 a fused sentence. D puts and after a semicolon, but the semicolon already joins like a period, so the and has no job; the two are never used together.',
      'B joins them with a semicolon, which is built to sit between two complete sentences. The answer is B.',
      'Now the other half of the concept: "Marisol repaired the antique clock in one [afternoon, a job her] grandfather had guessed would take a month." \u00b7 F. NO CHANGE \u00b7 G. afternoon; a job her \u00b7 H. afternoon. A job her \u00b7 J. afternoon a job her',
      '"A job her grandfather had guessed would take a month" has no verb of its own carrying it \u2014 it is a renaming of what she did. It LEANS. A semicolon and a period each demand a complete sentence on BOTH sides, so G and H break. J gives the renaming nothing to hang on at all. The plain comma is exactly right \u2014 the answer is F, NO CHANGE.'
    ],
    check: 'The whole concept is one test run twice: can each side stand alone? BOTH stand \u2014 you need a period, a semicolon, or a comma plus and. One side LEANS \u2014 the plain comma holds it, and the strong joints are suddenly the wrong answers. The trap runs in both directions: students who learn "comma splice bad" start grabbing semicolons on reflex, and the test writes items that punish exactly that. Check the sides first, every single time \u2014 then the punctuation picks itself.'
  },
  e3: {
    label: 'Show a worked example',
    title: '"Which choice provides the most logical transition between the two sentences?" \u2014 Ferns thrive in shade and damp soil. [Therefore], the cactus on my windowsill wants the opposite: full sun and dry roots.',
    steps: [
      'A. NO CHANGE \u00b7 B. In contrast, \u00b7 C. Similarly, \u00b7 D. For example,',
      'Cover the printed word with your finger before you do anything else. It is there to sell you on itself \u2014 read it and your brain quietly starts building a case for why it works.',
      'With it hidden, read the sentence before and the sentence after, and say in your own words how the two ideas relate. Ferns want shade and damp. The cactus wants sun and dry. The second sentence literally says "the opposite." These two ideas pull apart.',
      'Now uncover the choices and go find that relationship. Therefore claims one thing caused the other. Similarly claims they match \u2014 they do not. And a cactus is not an example of a fern.',
      'In contrast is the only one that labels a thing pulling away from the thing before it. The answer is B.',
      'Harder \u2014 the option of no transition at all: "Which choice, if any, provides the most logical transition?" Kofi laid the tiles one at a time, checking each corner with a level. [Nevertheless,] the finished floor was flat enough to roll a marble across. \u00b7 F. NO CHANGE \u00b7 G. In other words, \u00b7 H. For instance, \u00b7 J. DELETE the underlined portion.',
      'Careful work led to a flat floor \u2014 that is cause and effect. Nevertheless claims the two ideas fight, and they do not. In other words claims a restatement, but the second sentence is new information. For instance claims an example. All three put a wrong label on the relationship, so you take none of them. The answer is J.'
    ],
    check: 'Two habits win this concept. First, decide the relationship BEFORE you look at the words \u2014 every choice sounds reasonable when you read it cold, which is exactly what the wrong ones are counting on. Second, when DELETE is offered, take it seriously; it wins more often than students expect. That is a tendency, not a law \u2014 still check that every word offered mislabels the relationship before you take it. And remember the answer often lives OUTSIDE the underline: the sentence before is doing half the work.'
  },
  e4: {
    label: 'Show a worked example',
    title: '"Which choice is most concise?" \u2014 The volunteers met [at 6 a.m. in the early morning] to sandbag the levee.',
    steps: [
      'A. NO CHANGE \u00b7 B. at 6 a.m. in the morning \u00b7 C. in the early morning at 6 a.m. \u00b7 D. at 6 a.m.',

      'D tells you everything the other three tell you, in three words. The answer is D.',
      'Harder \u2014 the repeat is in the sentence BEFORE: Beekeepers check hives most often in spring, when colonies grow fastest. A single queen can lay two thousand eggs a day during those weeks, [a period of rapid colony growth]. \u00b7 F. NO CHANGE \u00b7 G. which is a time when the colony expands \u00b7 H. and the colony grows quickly then \u00b7 J. DELETE the underlined portion.',

    ],
    check: 'When all four choices mean the same thing, the shortest one almost always wins \u2014 not because short is prettier, but because the extra words are not carrying anything. Two warnings. DELETE is a live answer and often the right one; reaching for the second-shortest choice instead is exactly how you land on H. And shortest-wins has a limit: if the question names two things the sentence has to say, the shortest choice sometimes wins by quietly dropping one of them. Shortest wins ONLY among the choices that still say everything.'
  },
  e5: {
    label: 'Show a worked example',
    title: '"Which choice is most consistent with the tense of the passage?" \u2014 Last summer my brother [builds] a canoe in our garage and paddled it across the lake in September.',
    steps: [
      'A. NO CHANGE \u00b7 B. built \u00b7 C. has built \u00b7 D. will build',
      'Two different things hide inside this one topic. TENSE is when \u2014 did it already happen, is it happening now, will it happen later. FORM is the shape of the verb. This first one is tense.',
      'Find the time evidence and trust it over your ear. "Last summer" plants this in the past, and "paddled" later in the same sentence plants it there again. Two witnesses.',
      'A is present and D is future \u2014 both clash with those witnesses. C is the has form, and the present perfect cannot sit next to a finished, closed-off time like "last summer."',
      'B is the plain past, which is where the sentence already lives. The answer is B.',
      'Now FORM, which is where the points actually get lost: By the time the ranger reached the overlook, the storm [had began] to move up the valley. \u00b7 F. NO CHANGE \u00b7 G. had begun \u00b7 H. begun \u00b7 J. has began',
      'Begin \u2014 began \u2014 begun. Began is the plain past. Begun is the one that rides along after a helper. After had you need begun, so F and J are shapes English does not have at all. H throws the helper away, leaving "the storm begun," which is not a working verb. The answer is G.'
    ],
    check: 'The trap is that "had began" SOUNDS fine, because people say it out loud constantly. Your ear is not a witness here. After have, has or had, use the helper form \u2014 and that wrong version will be sitting right there among your four choices, waiting. Same rule catches "could of": it is the sound of "could\u2019ve" written down, and it is always could HAVE. When the choices differ only in verb shape, say the three parts to yourself \u2014 begin, began, begun \u2014 before you pick.'
  },
  e6: {
    label: 'Show a worked example',
    title: '"If the writer were to delete the underlined portion, the paragraph would primarily lose:" \u2014 The museum\u2019s collection includes four hundred carved netsuke, [each one no bigger than a grain of rice].',
    steps: [
      'A. a specific detail showing how small the carvings are. \u00b7 B. an explanation of why the museum acquired them. \u00b7 C. a comparison of two artists\u2019 techniques. \u00b7 D. nothing, since the phrase repeats earlier information.',
      'You are not judging whether the writing is good. You are naming the one job that piece does. Cover it with your thumb, read the sentence without it, and ask what disappeared.',

      'D would only be right if the size had already been mentioned. It had not, so something real is lost.',
      'A names exactly what those words do. The answer is A.',
      'Harder \u2014 a tempting wrong job: Every October the reservoir is drawn down for inspection, [exposing the stone foundations of the mill town flooded in 1938]. \u00b7 F. an indication of how long the inspection takes. \u00b7 G. a concrete image linking the reservoir to the town beneath it. \u00b7 H. an explanation of why the reservoir must be inspected. \u00b7 J. a transition to the next paragraph.',
      'H is tempting because the word "inspection" is sitting right there in the sentence. But the underlined phrase never explains why anyone inspects anything. What it does is show old foundations rising out of the water, tying the reservoir to the drowned town. The answer is G.'

    check: 'Be literal, and do not tell yourself a story. The right choice describes what the words DO, not what they hint at and not what a thoughtful reader might work out from them. If a choice says the phrase explains WHY something happened, go back and check the phrase actually says why \u2014 if it only tells you THAT it happened, that choice is out, however sensible it sounds. And watch for the word-match bait: grabbing a choice because it echoes a word you just read is exactly how you land on H. Point at the words on the page and ask, is that written here, or did I supply it myself?'
  },
  e7: {
    label: 'Show a worked example',
    title: '"Which choice is most precise here?" \u2014 The new filtration system had an immediate [affect] on the taste of the water.',
    steps: [
      'A. NO CHANGE \u00b7 B. effect \u00b7 C. affects \u00b7 D. effecting',
      'Cover the underline first. The word that is printed there anchors you \u2014 read it and your ear starts nodding along, and now the other three sound like changes instead of candidates. NO CHANGE gets judged from a standing start, same as everybody else.',
      'Read the sentence with a blank in it and say what the blank has to be. "An immediate ___ on the taste" \u2014 those words in front, "an immediate," are pointing at a THING.',
      'Affect is the doing word, to influence something. Effect is the thing itself, the result. C is a doing word too, and D is not a thing either.',
      'The answer is B. Notice the grammar settled it before the meaning got a vote.',
      'Harder \u2014 four near-twins, one exact fit: The river [meandered] straight through the valley for eleven miles. \u00b7 F. NO CHANGE \u00b7 G. wandered \u00b7 H. ran \u00b7 J. strayed',
      'All four are things a river could do, so your ear is useless. Now look at what the sentence already told you: STRAIGHT. Meander, wander and stray all carry a curve in them. Three of your choices are arguing with the sentence\u2019s own word. Only ran has no curve in it. The answer is H.'
    ],
    check: 'Do not ask which word sounds best. Ask which word CONTRADICTS something the sentence already told you \u2014 sentences usually give away their own answer, and the giveaway is often a single word sitting a few places away from the underline. And watch the fanciest option: meandered sounds like real river-writing, which is exactly why it is the trap. The bigger word loses every time a plain word means it better.'
  },
  e8: {
    label: 'Show a worked example',
    title: '"Which choice is most grammatically acceptable?" \u2014 My aunt Rosalind, a welder for thirty years[ can] read a seam the way other people read a page.',
    steps: [
      'A. NO CHANGE \u00b7 B. , can \u00b7 C. ; can \u00b7 D. , \u2014 can',
      'Some information is extra: lift it out with tweezers and a working sentence is still sitting there. Extra information gets a comma on each side, like handles. Information the sentence actually needs gets no commas at all.',
      'The second half of the rule is MATCHING. Whatever mark opens the extra part has to close it. Two commas, or two dashes. Never one of each.',
      'You already opened this aside with the comma after "Rosalind," so you have to close it the same way. A never closes it at all, leaving one handle. C tries to close with a semicolon, which does not pair with a comma. D uses both marks at once.',
      'The answer is B.',
      'Harder \u2014 the marks have to match the other way round: The recipe \u2014 handed down from my great-grandmother[, calls] for exactly nine cloves of garlic. \u00b7 F. NO CHANGE \u00b7 G. \u2014 calls \u00b7 H. calls \u00b7 J. , \u2014 calls',
      'This aside opened with a DASH, so it has to close with a dash. F closes with a comma, a mismatched pair. H closes with nothing, leaving that first dash hanging open. J uses both. The answer is G.'
    ],
    check: 'The name rule shows up on nearly every test, and it is decided by MEANING, not by ear. When a name follows a description, ask one question: does that description point to exactly one person? "My oldest brother, Teodoro, drives a bread truck" \u2014 you have only one oldest brother, so the name is extra and takes a comma on each side. "Chilean sculptor Ines Barros carved it" \u2014 there are plenty of Chilean sculptors, so the name is doing real identifying work and takes no commas at all. Watch this one closely: "My sister, Nadia, moved to Reno" tells you there is only one sister; "My sister Nadia moved to Reno" tells you there are others. Both will be offered, and only the meaning tells you which is right.'
  },
  e9: {
    label: 'Show a worked example',
    title: '"Which choice is most grammatically acceptable?" \u2014 Balancing a tray of [glasses Theo] backed through the kitchen door.',
    steps: [
      'A. NO CHANGE \u00b7 B. glasses, Theo \u00b7 C. glasses; Theo \u00b7 D. glasses, and Theo',
      'Commas have a short list of real jobs: separating items in a list, marking the end of a warm-up phrase at the front of a sentence, and teaming up with and, but or so to join two stand-alone sentences. That is mostly it. Everywhere else the default is NO comma.',
      '"Balancing a tray of glasses" has nobody doing it, so it cannot stand up alone. It is a warm-up leading into the real sentence, and warm-ups get a comma at the end.',
      'C needs a full sentence on its left and does not have one. D uses and to join a leaning phrase to a standing one, and and joins equals.',
      'The answer is B.',
      'Harder \u2014 a comma that has no business being there: The mechanic who rebuilt our [transmission, also] replaced the brake lines at no charge. \u00b7 F. NO CHANGE \u00b7 G. also \u00b7 H. also, \u00b7 J. , also,',
      'Who did it? The mechanic. What did he do? Replaced. Nothing goes in that gap. And "who rebuilt our transmission" is information you need \u2014 it tells you WHICH mechanic \u2014 so it takes no commas either. F, H and J each drop a comma into a seam that should stay closed. The answer is G.'
    ],
    check: 'Three quick rules that pay for themselves. Never put a comma directly before that \u2014 not "she argued, that" and not "the shelf, that broke"; if a choice does it, cross it off before you read the rest. A lone comma in the middle of a sentence is almost always wrong, because one comma with no partner reads as an instruction to lift out everything on one side of it. And when you do see two commas, lift out what sits between them and ask BOTH questions: does the sentence still work, and was that piece really optional? The habit to break is adding a comma because you would take a breath there. That instinct drops one right after a long subject, and that version is always one of your four choices.'
  },
  e10: {
    label: 'Show a worked example',
    title: 'A paragraph on a village\u2019s new solar-powered water pump. Proposed addition: "Solar panels first flew on a 1958 satellite." Should the writer add it?',
    steps: [
      'A. Yes, because it names the pump\u2019s designer. \u00b7 B. Yes, because it explains how the panels were made. \u00b7 C. No, because it strays from the village\u2019s water supply. \u00b7 D. No, because the satellite claim is unverified.',
      'Two Yes answers, two No answers, each with a reason attached. BOTH HALVES have to be right \u2014 the right verdict with a wrong reason is still wrong.',
      'One thing that saves a lot of grief: the test is TELLING you the added sentence is true. Never fact-check it. That kills D outright, and D is there every time.',
      'Now put your finger on the words that would make each reason true. A says it names a designer \u2014 no designer appears. B says it explains how the panels were made \u2014 no manufacturing appears.',
      'What is left is the real problem: the paragraph is about a village\u2019s water, and this wanders off to satellites. The answer is C.',
      'Harder \u2014 two Yes options: A paragraph on a city\u2019s first year of bike sharing. Proposed addition: "Riders logged 1.2 million trips that year." \u00b7 F. Yes, because it gives concrete evidence of heavy use. \u00b7 G. Yes, because it explains why stations went downtown. \u00b7 H. No, because the paragraph already gave that count. \u00b7 J. No, because ridership is irrelevant here.',
      'Yes is clearly the verdict, so the whole game is in the reasons. G says the sentence explains WHERE stations went \u2014 it does not, it counts trips. F names what a big number actually does: it proves heavy use. The answer is F.'
    ],
    check: 'The design of these questions is to catch you locking in Yes or No and then skimming the reasons \u2014 G sits right next to F for exactly that purpose. So be literal, and do not tell yourself a story. Each because is making a claim about what the sentence DOES, and you check that claim against the actual words, not against the version your brain helpfully built. A reason that says the sentence explains WHY fails if the sentence only tells you THAT. If you cannot put your finger on the exact words that make the reason true, the choice is out \u2014 even when it sounds like something a careful person would say.'
  },
  e11: {
    label: 'Show a worked example',
    title: 'An essay on the Cranmoor lifeboat station: the volunteers who have crewed it, the launches they have made, and the boathouse rebuilt in 1977. Suppose the writer\u2019s primary purpose had been to describe lifeboat stations along the coast. Would this essay accomplish that purpose?',
    steps: [
      'A. Yes, because the essay keeps to the Cranmoor station from beginning to end. \u00b7 B. Yes, because the writing about the station is clear and careful throughout. \u00b7 C. No, because the essay describes a single station and not stations along the coast. \u00b7 D. No, because the essay\u2019s claims about the station have not been checked.',
      'Two Yes, two No, each with a reason bolted on. BOTH HALVES have to be right \u2014 the correct verdict wearing a false reason is still wrong, and one of those is always sitting there.',
      'Kill the two that are never reasons first. D fact-checks the essay, but the test certifies its own facts; you are judging whether the essay did the JOB. B praises the writing, and nobody asked how well it was written. Neither is ever the answer, on any passage.',
      'That leaves A and C, and the purpose is where the work is: \u201cstations along the coast\u201d is plural. It asked for a survey.',
      'A is perfectly true as a statement \u2014 the essay really does keep to Cranmoor \u2014 and that is exactly why it fails. One station is not a coast full of them. The answer is C.',
      'Harder \u2014 the purpose names one part: An essay on the Hollins bandstand: it has stood in the park since 1908, a brass band played there every Sunday for sixty years, and its cast-iron roof was regilded in 1972. Suppose the primary purpose had been to describe the bandstand\u2019s cast-iron roof. \u00b7 F. Yes, because the essay keeps to the Hollins bandstand from beginning to end. \u00b7 G. Yes, because the roof is described with real care. \u00b7 H. No, because only one part of the essay touches that, and the question asks about the whole of it. \u00b7 J. No, because the bandstand is the essay\u2019s subject, and the purpose names another.',
      'F is true and still wrong: the purpose did not name the bandstand, it named the roof. J is simply false \u2014 the essay IS about the bandstand. G is the craft trap again. Now count: how many of the three sentences touch the roof? One. A purpose that a single sentence satisfies is not a purpose the whole essay accomplishes. The answer is H.'
    ],
    check: 'Read the purpose first, then count. A stated purpose touches the essay everywhere, in one place, or nowhere \u2014 and those three cases are the three ways to answer No: the essay is about something else, the purpose names one slice of it, or the purpose asked for a survey and got one example. Everywhere means Yes. One more rule worth having by heart: a purpose that asks WHY cannot be met by an essay that only says WHAT, however full it is. Then check the reason as a claim and put your finger on the words that make it true \u2014 remembering that two reasons never do: that the facts want checking, and that the writing is good.'
  },
  e12: {
    label: 'Show a worked example',
    title: 'The kit contains everything a beginner [needs: three] brushes, a mixing tray, and a jar of gesso.',
    steps: [
      'A. NO CHANGE \u00b7 B. needs; three \u00b7 C. needs, three \u00b7 D. needs three',
      'Three tools, three jobs. A semicolon is a bridge between two sentences that could each stand on their own, so it needs solid ground at BOTH ends. A colon is a pointing finger \u2014 it says here it comes, then delivers. It needs a whole sentence on its left, but the right side can be anything at all. A dash does either job, and never travels alone.',
      'Almost everyone checks the right side first. Check the LEFT. \u201cThe kit contains everything a beginner needs\u201d stands up on its own, so a mark is allowed here \u2014 and \u201ceverything a beginner needs\u201d is a promise, which is exactly what a colon points at.',
      'Now the others. B is a bridge, and a bridge needs a whole sentence on the far side; \u201cthree brushes, a mixing tray, and a jar of gesso\u201d is a naming, not a sentence. C makes \u201cthree brushes\u201d read like one more item sitting next to \u201cneeds.\u201d D smashes the lead-in and the list together with nothing between them. The answer is A.',
      'One free elimination worth knowing. A semicolon and a period do the SAME job, so if two choices are word-for-word identical apart from that one mark, cross off both \u2014 they would be equally right, and there is only ever one answer. Careful, though: it only works when the rest matches exactly. \u201cyears; the tower\u201d and \u201cyears; and the tower\u201d are one word apart, and one of them is the answer.',
      'Harder \u2014 sometimes no mark belongs at all: The weathervane was regilded [by: a] retired sign painter, a bell-founder\u2019s apprentice, and a chemist. \u00b7 F. NO CHANGE \u00b7 G. by a \u00b7 H. by; a \u00b7 J. by\u2014a',
      'A list has appeared, so the hand reaches for the colon. Check the left first: \u201cThe weathervane was regilded by\u201d cannot stand up \u2014 it is still reaching for the next word. That kills the colon, the semicolon and the dash in one stroke, because none of the three belongs after something unfinished. Nothing at all separates \u201cby\u201d from what it points to. The answer is G.'
    ],
    check: 'Build the habit in this order and these stop being hard. First, cover the right side and ask whether the left could be a sentence by itself; if it could not, the answer is almost always the plain one with no mark in it. Second, if the left does stand up, ask what the right side is \u2014 a whole sentence takes a semicolon, a naming or an explanation takes a colon, and a colon also wants the left side to have promised something. Third, if you see one dash, go looking for its partner: dashes fence an aside at both ends, and a fence closed with a comma is not closed. And never write a joining word after a semicolon. There is no such thing as \u201c; and.\u201d'
  },
  e13: {
    label: 'Show a worked example',
    title: 'The three [coppersmith\u2019s] benches ran the length of the shop.',
    steps: [
      'A. NO CHANGE \u00b7 B. coppersmiths\u2019 \u00b7 C. coppersmiths \u00b7 D. coppersmiths\u2019s',
      'An apostrophe has exactly two jobs. It shows that something belongs to someone, or it marks where letters were squeezed out of a shortened word. It never, ever makes a word plural, and the ownership words that came pre-loaded \u2014 its, yours, theirs, whose \u2014 never take one either.',
      'So do it in two steps, and never in one. Step one: how many owners? \u201cThree\u201d settles it, so you start from coppersmiths. Step two: where does the apostrophe go? A plural that already ends in s takes a bare apostrophe after that s, and nothing follows it.',
      'That gives coppersmiths\u2019, which is B. A is the one-owner version, and it fights with \u201cthree.\u201d C shows no ownership at all, and the next word is the thing being owned. D adds a second s that has no work to do.',
      'The commonest mistake in the whole topic is putting an apostrophe on a word just because it ends in s. Verbs end in s all the time \u2014 the shop closes at four, the gate leaks each winter \u2014 and a verb never owns anything, so it never takes one.',
      'Harder \u2014 four look-alikes: The telescope stopped tracking when [its\u2019] drive motor stalled. \u00b7 F. NO CHANGE \u00b7 G. it\u2019s \u00b7 H. its \u00b7 J. it is',
      'Go one at a time. F is not a word in English \u2014 not here, not in any sentence, ever. G unpacks to \u201cit is\u201d, which gives \u201cwhen it is drive motor stalled\u201d, and J is that same nonsense written out in full. The ownership word is the only one left standing, so the answer is H.'
    ],
    check: 'Say it out loud as two words. If \u201cit is\u201d fits, you wanted it\u2019s; if it does not, you wanted its \u2014 and its\u2019 is never the answer to anything. One warning the shortcut leaves out: it\u2019s is sometimes \u201cit has\u201d, as in \u201cit\u2019s been off since Friday\u201d, so a sentence that refuses \u201cit is\u201d may still want the apostrophe. And for ordinary nouns, always count the owners before you place the mark. One owner takes apostrophe-s. More than one, ending in s, takes the bare apostrophe after it. More than one that does NOT end in s \u2014 children, women, geese \u2014 takes apostrophe-s exactly like a singular, because the rule was never about the letter s. It was always about where the plural ends.'
  },
  e14: {
    label: 'Show a worked example',
    title: 'Racing to finish before dark, [the last row of beans was planted by Dad].',
    steps: [
      'A. NO CHANGE \u00b7 B. the beans in the last row got planted by Dad. \u00b7 C. Dad planted the last row of beans. \u00b7 D. planting the beans was finished by Dad.',
      'A describing phrase describes whatever sits closest to it. Not what you meant \u2014 what is NEXT TO IT. So somebody was racing, and whoever comes first after that comma is who the sentence says was racing.',

function conceptOfPQ(){
  const s = String((PR && PR.skill) || '');
  let m = s.match(/^concept:(\d+)$/);
  if(m) return parseInt(m[1], 10);
  m = s.match(/^english:(\d+)$/);
  return m ? 'e' + m[1] : null;   // english worked examples key as 'e1', 'e2'…
}
function toggleWorked(){
  const el = document.getElementById('worked-body');

  if(!el) return;
  const open = el.style.display !== 'none';

}

// math_items row -> the shape renderPQ already understands
function adaptMathItem(r, skill){
  const q = { id:r.item_id, skill, section:'math', stem:r.stem,
    answer_a:String(r.choice_1), answer_b:String(r.choice_2),
    answer_c:String(r.choice_3), answer_d:String(r.choice_4),

  // rationale_N names the mistake behind choice N; shown when that choice is picked

async function startPractice(skill, mode){
  mode = PMODE_LABEL[mode] ? mode : 'content';
  if(PR && PR.qTimerId){ clearInterval(PR.qTimerId); PR.qTimerId=null; }
  const el = document.getElementById('v-practice');
  el.innerHTML = skel(3); go('practice');
  const origSkill = skill;
  let topic = skill, conceptNo = null;
  const cmMatch = String(skill).match(/^concept:(\d+)$/);
  if(cmMatch) conceptNo = parseInt(cmMatch[1],10);
  // English concepts live in their own tables; same dealer, different shelf
  const emMatch = String(skill).match(/^english:(\d+)$/);
  if(emMatch){
    if(await startConceptPractice(parseInt(emMatch[1],10), origSkill, mode, undefined, 'english')) return;
  }
  try{
    const {data:m} = await db.from('skill_drill_map').select('*').eq('skill', skill).maybeSingle();
    if(m && m.drill_topic) topic = m.drill_topic;
    if(m && m.concept_no!=null) conceptNo = m.concept_no;
  }catch(_){}
  skill = topic;
  // concept-tagged skills serve from the new math bank; anything else (or an
  // empty concept) falls through to the old practice_questions path unchanged
  if(conceptNo!==null){
    if(await startConceptPractice(conceptNo, origSkill, mode)) return;
  }
  const {data:qs, error} = await db.from('practice_questions').select('*').eq('skill', skill);
  if(error || !qs || !qs.length){
    el.innerHTML = '<div class="card"><h2>Practice: '+esc(skill.replace(/_/g,' '))+'</h2><p class="dim">No practice questions for this topic yet — check back soon'+(error?' ('+esc(error.message)+')':'')+'.</p><button class="btn2" style="margin-top:14px" onclick="renderHome().then(()=>go(\'home\'))">Back to dashboard</button></div>';
    return;
  }
  const pool = qs.sort(()=>Math.random()-0.5);
  let sessionId = null;
  try{
    const {data:sess} = await db.from('practice_sessions').insert({student_id:ME.id, skill, total:Math.min(10,pool.length)}).select().single();
    sessionId = sess ? sess.id : null;
  }catch(_){}
  const target = mode==='careless' ? Math.min(6, pool.length) : Math.min(10, pool.length);
  PR = {skill, mode, pool, idx:0, target, rec:[], cur:null, curAnswer:null, pending:null, awaitConf:false, streak:0, best:0, qLimit:0, qRemaining:0, qTimerId:null, sessionId};
  advancePQ();
}
function prRight(){ return PR.rec.filter(x=>x.correct).length; }
function pqDone(){ return PR.mode==='careless' ? PR.best>=PR.target : prRight()>=PR.target; }
function advancePQ(){
  if(PR.qTimerId){ clearInterval(PR.qTimerId); PR.qTimerId=null; }
  if(pqDone() || PR.idx>=PR.pool.length){ practiceReport(); return; }
  PR.cur = PR.pool[PR.idx++];
  PR.curAnswer = null; PR.pending = null; PR.awaitConf = false;
  if(PR.mode==='timing'){
    const d = Math.max(1, Math.min(5, PR.cur.difficulty||3));
    const mult = [0.8, 1.0, 1.2, 1.4, 1.6][d-1];
    PR.qLimit = Math.round((PACE[PR.cur.section]||50) * mult * (ME.extra_time?1.5:1));
    PR.qRemaining = PR.qLimit;
    PR.qTimerId = setInterval(pqTick, 1000);
  }
  renderPQ();
}
function pqTick(){
  PR.qRemaining--;

    clearInterval(PR.qTimerId); PR.qTimerId=null;
    PR.curAnswer = 'T';

    PR.rec.push({q:PR.cur, answer:null, correct:false, timeout:true, time:PR.qLimit});
    if(PR.sessionId && !PR.newBank) db.from('practice_attempts').insert({session_id:PR.sessionId, question_id:PR.cur.id, position:PR.rec.length, answer:null, correct:false}).then(()=>{});
    if(PR.newBank){ if(PR.section==='english') db.from('english_item_seen').upsert({student_id:ME.id, item_id:PR.cur.id}).then(()=>{}).catch(()=>{}); else db.rpc('mark_math_item_seen', {p_student:ME.id, p_item:PR.cur.id}).then(()=>{}).catch(()=>{}); }
    renderPQ();
  }
}

  h += '<div class="card">';
  if(q.passage) h += '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;white-space:pre-wrap;font-size:14px;line-height:1.85;color:var(--soft)">'+esc(q.passage)+'</div>';

function pickP(L){
  if(PR.curAnswer!==null) return;
  if(PR.mode==='careless'){ PR.pending = L; renderPQ(); return; }
  if(PR.mode==='confidence'){
    if(PR.pending!==null) return;
    PR.pending = L; PR.awaitConf = true; renderPQ(); return;
  }
  commitP(L);
}
function commitP(L, conf){
  if(PR.curAnswer!==null) return;
  if(PR.qTimerId){ clearInterval(PR.qTimerId); PR.qTimerId=null; }
  PR.curAnswer = L;
  PR.awaitConf = false;
  const correct = L===PR.cur.correct_choice;
  if(correct){ PR.streak++; PR.best = Math.max(PR.best, PR.streak); } else { PR.streak = 0; }
  if(PR.newBank && !correct && PR.cur._rats && PR.cur._rats[L]) PR.cur.misconception = PR.cur._rats[L];
  PR.rec.push({q:PR.cur, answer:L, correct, conf:conf||null, time: PR.mode==='timing' ? (PR.qLimit - PR.qRemaining) : null});
  if(PR.sessionId && !PR.newBank) db.from('practice_attempts').insert({session_id:PR.sessionId, question_id:PR.cur.id, position:PR.rec.length, answer:L, correct}).then(()=>{});
  if(PR.newBank){ if(PR.section==='english') db.from('english_item_seen').upsert({student_id:ME.id, item_id:PR.cur.id}).then(()=>{}).catch(()=>{}); else db.rpc('mark_math_item_seen', {p_student:ME.id, p_item:PR.cur.id}).then(()=>{}).catch(()=>{}); }
  renderPQ();
}
// record a study-plan day's drill result. pct = accuracy (color-coded % under gem); met = did they
// attempt the full question goal (gold gem) or bail early (grey gem).
function recordQuestDay(pct, met){
  try{ if(window.__questDay){ const q=window.__questDay; if(q.planId && q.day){
    let sc={}; try{ sc=JSON.parse(localStorage.getItem('smx_qscore_'+q.planId)||'{}'); }catch(_){}
    sc[q.day]= sc[q.day]!=null ? Math.round((sc[q.day]+pct)/2) : pct;
    localStorage.setItem('smx_qscore_'+q.planId, JSON.stringify(sc));
    let mt={}; try{ mt=JSON.parse(localStorage.getItem('smx_qmet_'+q.planId)||'{}'); }catch(_){}
    mt[q.day] = !!met || !!mt[q.day];   // once the goal is hit it stays hit
    localStorage.setItem('smx_qmet_'+q.planId, JSON.stringify(mt));
    if(typeof db!=='undefined' && ME) db.from('quest_days').upsert({student_id:ME.id, plan_id:q.planId, day_num:q.day, completed:mt[q.day], accuracy:sc[q.day]}, {onConflict:'student_id,plan_id,day_num'}).then(()=>{}).catch(()=>{});
    window.__questDay=null;
  }} }catch(_){}
}
// exiting a drill early still banks accuracy + whether the question goal was reached
function exitPractice(){
  try{ const nTried = (PR&&PR.rec) ? PR.rec.length : 0; if(nTried>0 && window.__questDay){ const met = nTried >= (PR.target||10); recordQuestDay(Math.round(100*prRight()/nTried), met); } }catch(_){}
  renderPlans();   // back to the study plan (quest map), not the dashboard
}

let QSTATE = null;
function qPretty(s){ s = String(s||'').replace(/_/g,' '); return s.charAt(0).toUpperCase()+s.slice(1); }
function qBuildNodes(pl, goal){
  const steps = (pl.plan_steps||[]).sort((a,b)=>a.position-b.position);
  const nodes = [];
  const hasNaturalChecks = steps.some(st=>/retest|practice test/i.test(st.title||''));
  const secs = ['english','math','reading','science'];
  let day = 0, ci = 0;
  steps.forEach((st,i)=>{
    day++;
    const isCheck = /retest|practice test/i.test(st.title||'');
    const sk = planSkill(st);
    nodes.push({kind:isCheck?'check':'day', st, day,
      sub: isCheck ? st.title.replace(/^.*?:\s*/,'') : (sk ? qPretty(sk) : (st.title||'').replace(/^Fix:\s*/i,'').slice(0,18)),
      done: st.status==='done', sec: null});
    if(!hasNaturalChecks && (i+1)%5===0 && i<steps.length-1){
      const sec = secs[ci++ % 4];
      nodes.push({kind:'check', st:null, virtual:true, vIdx:nodes.length, sec,
        sub: qPretty(sec)+' retest',
        done: localStorage.getItem('smx_qc_'+pl.id+'_'+nodes.length)==='1'});
    }
  });
  nodes.push({kind:'final', st:null, sub: (goal&&goal.target_date)?('The ACT \u00b7 '+goal.target_date):'The ACT', done:false});
  return nodes;
}

function qDrawTrail(){
  const {nodes, todayIdx, W, H} = QSTATE;

  for(let i=1;i<=todayIdx;i++) ddDone+=seg(nodes[i-1],nodes[i]);
  for(let i=todayIdx+1;i<nodes.length;i++) ddFut+=seg(nodes[i-1],nodes[i]);
  let s='<defs><filter id="qgold" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge></filter></defs>';
  if(todayIdx>0){
    s+='<path d="'+ddDone+'" fill="none" stroke="#caa23e" stroke-width="22" stroke-linecap="round" opacity="0.30" filter="url(#qgold)"/>';
  }
  s+='<path d="'+ddFut+'" fill="none" stroke="#20263e" stroke-width="15" stroke-linecap="round" opacity="0.85"/>';
  s+='<path d="'+ddFut+'" fill="none" stroke="#3a4468" stroke-width="15" stroke-linecap="round" stroke-dasharray="1 22" opacity="0.7"/>';
  if(todayIdx>0){
    s+='<path d="'+ddDone+'" fill="none" stroke="#7c5cf0" stroke-width="15" stroke-linecap="round"/>';
    s+='<path d="'+ddDone+'" fill="none" stroke="#b9a4fb" stroke-width="5" stroke-linecap="round" opacity="0.7"/>';
  }
  document.getElementById('qtrail').innerHTML = s;
}
