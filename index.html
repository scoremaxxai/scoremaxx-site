function qStartGrass(){
  if(QRAF){ cancelAnimationFrame(QRAF); QRAF = null; }
  const {W,H} = QSTATE;
  const cv = document.getElementById('qgrass');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const nB = Math.min(Math.floor(W*H/700), 1400);
  const blades=[];
  for(let k=0;k<nB;k++){
    const y = Math.random()*H;
    blades.push({x:Math.random()*W, y, h:(14+Math.random()*26)*(0.75+0.5*(y/H)), lean:(Math.random()*16-8), ph:Math.random()*6.28, sp:0.4+Math.random()*0.5});
  }
  blades.sort((a,b)=>a.y-b.y);
  const grad = ctx.createLinearGradient(0,H,0,0);
  grad.addColorStop(0,'#0f5f45'); grad.addColorStop(0.55,'#22c98a'); grad.addColorStop(1,'#5affc0');
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(t){
    ctx.clearRect(0,0,W,H);
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(139,63,240,0.30)'; ctx.lineWidth=3.4;
    ctx.beginPath();
    blades.forEach(b=>{ const s=Math.sin(t*0.001*b.sp+b.ph)*4; ctx.moveTo(b.x,b.y); ctx.quadraticCurveTo(b.x+(b.lean+s)/2, b.y-b.h*0.55, b.x+b.lean+s, b.y-b.h); });
    ctx.stroke();
    ctx.strokeStyle=grad; ctx.lineWidth=1.8;
    ctx.beginPath();
    blades.forEach(b=>{ const s=Math.sin(t*0.001*b.sp+b.ph)*4; ctx.moveTo(b.x,b.y); ctx.quadraticCurveTo(b.x+(b.lean+s)/2, b.y-b.h*0.55, b.x+b.lean+s, b.y-b.h); });
    ctx.stroke();
    if(!still){
      if(document.getElementById('qgrass')!==cv){ QRAF=null; return; }
      QRAF = requestAnimationFrame(draw);
    }
  }
  draw(0);
}

function m4build(pl, goal){
  const raw = (pl.plan_steps||[]).sort((a,b)=>a.position-b.position);
  const start = new Date((pl.created_at?String(pl.created_at).slice(0,10):new Date().toISOString().slice(0,10))+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const weekendsOff = m4weekendsOff(pl);
  // build the list of eligible STUDY dates from start \u2192 test date; weekends excluded when off
  let end = goal && goal.target_date ? new Date(goal.target_date+'T00:00:00') : new Date(start.getTime()+29*86400000);
  const dates = [];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const dow=d.getDay();
    if(weekendsOff && (dow===0||dow===6)) continue;   // skip Sat/Sun \u2014 they don't count toward the plan
    dates.push(new Date(d));
  }
  if(!dates.length) dates.push(new Date(start));
  // cap length at 60 study days (min: whatever is available \u2014 plans under 30 days are allowed,
  // they simply fall outside the money-back-guarantee window handled at purchase)
  let studyDates = dates.length>60 ? dates.slice(dates.length-60) : dates;
  const total = studyDates.length;
  const WK = weekendsOff ? 5 : 7;                       // one retest at the end of each week
  // today = number of study dates on/before now (completion still gates the "current" node in render)
  let today = 0; studyDates.forEach(dt=>{ if(dt<=now) today++; }); today = m4clamp(today, 1, total+1);
  const focus = raw.map(st=>({title:(st.title||'').replace(/^Fix:\s*/i,''), desc:st.description||'', skill:planSkill(st), st})).filter(f=>f.skill||f.title);
  const days = []; let fi=0;
  for(let i=0;i<total;i++){
    const d=i+1, dt=studyDates[i];
    if(d===total){ days.push({day:d, dt, kind:'act'}); continue; }
    if(d%WK===0){ days.push({day:d, dt, kind:'retest', sec:M4_ORDER[(Math.floor(d/WK)-1)%4]}); continue; }
    const f = focus.length ? focus[fi++%focus.length] : null;
    const tasks = f
      ? ['Watch the '+(f.title||'skill').toLowerCase()+' lesson','Drill '+(f.title||'this skill').toLowerCase()+' to 10 correct'].concat(d%3===0?['Quick review of the past 2 days']:[])
      : ['Warm-up: review yesterday\u2019s notes','Core skill practice (20 min)','Challenge problem of the day'];
    days.push({day:d, dt, kind:'day', focus:f, tasks});
  }
  return {total, today, cleared:m4clamp(today-1,0,total), days, weekendsOff, SCORES:m4scores(pl), MET:m4met(pl), pl, goal};
}

function m4layout(){
  const map = document.getElementById('m-map');
  const wRaw = map.clientWidth || 600;
  // mobile: narrower 5-wide grid that fits a phone; desktop: 7-wide centered band. Both paginate.
  const isMobile = document.body.classList.contains('mview') || wRaw < 620;
  const cols = isMobile ? 5 : 7;                 // gems per row
  const ROWS_PER_PAGE = isMobile ? 5 : 6;        // → mobile 25/page, desktop 42/page
  const capW = isMobile ? 560 : 880;
  const w = Math.min(wRaw, capW);
  const xOff = Math.max(0, (wRaw - w) / 2);
  const N = M4.total;
  const perPage = cols*ROWS_PER_PAGE;
  const pages = Math.max(1, Math.ceil(N/perPage));
  M4.perPage=perPage; M4.pages=pages;
  // first render: land on the page that holds "today"
  if(M4.page==null) M4.page=Math.floor((m4clamp(M4.today,1,N)-1)/perPage);
  M4.page=m4clamp(M4.page,0,pages-1);
  const start=M4.page*perPage, end=Math.min(start+perPage,N), count=end-start;
  M4.pageStart=start;
  const rows=Math.ceil(count/cols);
  const mX = w<480?40:56, GY=112, usable=w-mX*2;
  M4.curveScale = 1;                          // fixed spacing → original mobile wobble constants
  const nodes=[];
  for(let i=0;i<count;i++){ const gi=start+i; const r=Math.floor(i/cols); let c=i%cols; if(r%2===1)c=cols-1-c; const x=xOff+mX+(cols===1?usable/2:usable*c/(cols-1)); const wob=Math.sin(gi*2.7)*12; const y=52+r*GY+wob; nodes.push({x,y,day:start+i+1}); }
  map.style.height=(52+rows*GY+30)+'px';
  M4.nodes=nodes; M4.w=wRaw;
}

// ---------- PRACTICE LIBRARY ----------
// Every math concept, grouped the way the ACT reports them, most-tested first.
// The list comes from the concepts catalogue; the video for a concept comes
// from learn_for_concept(), which knows not just WHICH shoot covers it but the
// exact second its chapter starts at — so one long filmed session serves many
// concepts, each opening at its own moment. A concept whose shoot has no
// uploaded video yet gets the same "coming soon" card the daily Learn uses.
//
// THE STAR IS THE STUDENT'S, not the catalogue's. Tap it to pin a concept to
// the top of its category; tap again to unpin. Pins live in concept_stars so
// they follow the student across devices, mirrored to localStorage so the
// button still works (per device) if that table has not been created yet.
// The catalogue's own is_starred column is deliberately NOT shown here — it
// records which concepts were verified on all four captured forms, a research
// flag that reads as "study me first" when a student sees it, and it is wrong
// for that job: it stars a 0.2-per-test concept while the catalogue's four
// most frequent go unstarred.
let LIB = null, LIBV = null, LIB_STARS = null, LIB_DB_STARS = false;
let ELIB = null, ELIVE = null;    // english catalogue + which concepts have banks
let LIB_SEC = 'math';             // which section tab is open
const LIB_CATS = ['Number & Quantity','Algebra','Functions','Geometry',
                  'Statistics & Probability','Integrating Essential Skills'];
const LIB_CODE = {NUM:'Number & Quantity',ALG:'Algebra',FUN:'Functions',GEO:'Geometry',
                  STAT:'Statistics & Probability',IES:'Integrating Essential Skills'};
function libLsKey(){ return 'sm_stars_' + ((ME && ME.id) || 'anon'); }
async function libLoad(){
  if(LIB) return LIB;
  let rows = null;
  try{
    const {data} = await db.from('concepts')
      .select('concept_id,concept_no,name,category,q_per_form')
      .eq('section','math').order('concept_no');
    if(data && data.length) rows = data;
  }catch(_){}
  if(!rows){
    // the catalogue table is not readable — fall back to the recipes the banks
    // themselves installed, which every student can already read
    try{
      const {data} = await db.from('math_recipes').select('concept_no,concept_name,category');
      const seen = {};
      (data||[]).forEach(r=>{ if(!seen[r.concept_no]) seen[r.concept_no] =
        {concept_no:r.concept_no, name:r.concept_name,
         category:LIB_CODE[r.category]||r.category, q_per_form:null}; });
      rows = Object.values(seen);
    }catch(_){ rows = []; }
  }
  LIB = rows;
  // which concepts have a filmed, uploaded lesson — for the ▶ badge only; the
  // overlay re-checks properly when opened. Failure here just means no badges.
  try{
    const [{data:cv},{data:sh}] = await Promise.all([
      db.from('concept_video').select('concept_id,shoot_no'),
      db.from('shoots').select('shoot_no,video_url')]);
    const up = {}; (sh||[]).forEach(x=>{ if(x.video_url) up[x.shoot_no]=true; });
    LIBV = {}; (cv||[]).forEach(x=>{ if(up[x.shoot_no]) LIBV[x.concept_id]=true; });
  }catch(_){ LIBV = null; }
  // the English catalogue and which of its concepts have live banks
  try{
    const {data} = await db.from('concepts')
      .select('concept_id,concept_no,name,category,q_per_form')
      .eq('section','english').order('concept_no');
    ELIB = data || [];
  }catch(_){ ELIB = []; }
  try{
    const {data} = await db.from('english_recipes').select('concept_no');
    ELIVE = new Set((data||[]).map(r=>r.concept_no));
  }catch(_){ ELIVE = new Set(); }
  // the student's own stars: the table when it exists, localStorage otherwise.
  // Keys are section-qualified ('math:5', 'english:1') because concept numbers
  // repeat across sections.
  LIB_STARS = new Set(); LIB_DB_STARS = false;
  try{
    if(ME && ME.id){
      const {data, error} = await db.from('concept_stars')
        .select('concept_no,section').eq('student_id', ME.id);
      if(!error && data){
        LIB_DB_STARS = true;
        data.forEach(r=>LIB_STARS.add((r.section||'math')+':'+r.concept_no));
      }
    }
  }catch(_){}
  if(!LIB_DB_STARS){
    try{ JSON.parse(localStorage.getItem(libLsKey())||'[]').forEach(n=>LIB_STARS.add(String(n).indexOf(':')<0 ? 'math:'+n : n)); }catch(_){}
  }
  return LIB;
}
function libSort(a,b){
  const sa=LIB_STARS.has('math:'+a.concept_no)?1:0, sb=LIB_STARS.has('math:'+b.concept_no)?1:0;
  if(sb!==sa) return sb-sa;
  const qa=a.q_per_form==null?-1:+a.q_per_form, qb=b.q_per_form==null?-1:+b.q_per_form;
  if(qb!==qa) return qb-qa;
  return a.concept_no-b.concept_no;
}
async function libToggleStar(no, ev, section){
  if(ev) ev.stopPropagation();
  if(!LIB_STARS) return;
  section = section || 'math';
  const key = section + ':' + no;
  const on = !LIB_STARS.has(key);
  if(on) LIB_STARS.add(key); else LIB_STARS.delete(key);
  // localStorage always, so the star works before the table exists and the
  // device keeps a copy either way
  try{ localStorage.setItem(libLsKey(), JSON.stringify(Array.from(LIB_STARS))); }catch(_){}
  if(LIB_DB_STARS && ME && ME.id){
    try{
      if(on) await db.from('concept_stars').upsert({student_id:ME.id, concept_no:no, section});
      else   await db.from('concept_stars').delete()
                     .eq('student_id',ME.id).eq('concept_no',no).eq('section',section);
    }catch(_){}
  }
  // re-render so the pin takes its place at the top; keep whatever the
  // student had typed in the search box
  const q = (document.getElementById('libq')||{}).value || '';
  await renderLibrary();
  const box = document.getElementById('libq');
  if(box && q){ box.value = q; libFilter(q); }
}

  const byStudent={};
  (sessions||[]).forEach(s=>{ (byStudent[s.student_id]=byStudent[s.student_id]||[]).push(s); });
  const rows=(students||[]).map(st=>{
    const ss=byStudent[st.id]||[]; const last=ss[0];
    return '<tr><td><b>'+esc(st.full_name||'(no name)')+'</b></td><td>'+ss.length+'</td>'+
      '<td>'+(last? last.started_at.slice(0,10)+' · '+esc(last.tests?.name||'') : '<span class="dim">never</span>')+'</td>'+
      '<td>'+(last? '<b>'+last.est_score+'</b>' : '—')+'</td>'+
      '<td>'+(last? '<a class="link" onclick="openSession(\''+last.id+'\')">Latest report</a>':'')+'</td></tr>';
  }).join('');
  el.innerHTML='<div class="card"><h2>Tutor Dashboard — Student Roster</h2>'+
    (rows?'<table><tr><th>Student</th><th>Tests taken</th><th>Last test</th><th>Last score</th><th></th></tr>'+rows+'</table>'
    :'<div class="emptystate"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg><br><b>No students yet</b><br>Send students your site link — they create accounts, take a diagnostic, and appear here automatically.</div>')+
    '<div class="notice">All sessions: '+(sessions||[]).length+'. Full per-student trend views land in the next build phase.</div></div>'+
    '<div class="card"><h2>Recent Sessions</h2><table><tr><th>Date</th><th>Test</th><th>Raw</th><th>Score</th><th></th></tr>'+
    (sessions||[]).slice(0,20).map(s=>'<tr><td>'+s.started_at.slice(0,10)+'</td><td>'+esc(s.tests?.name||'')+'</td><td>'+s.raw_correct+'/'+s.raw_total+'</td><td><b>'+s.est_score+'</b></td><td><a class="link" onclick="openSession(\''+s.id+'\')">Report</a></td></tr>').join('')+'</table></div>';
}

boot();



</script>
</body>
</html>
