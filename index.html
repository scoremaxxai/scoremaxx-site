<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScoreMaxx">
<title>ScoreMaxx AI — ACT Diagnostics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2226%22 fill=%22none%22 stroke=%22%235b8cff%22 stroke-width=%228%22 stroke-dasharray=%22122 41%22 stroke-linecap=%22round%22 transform=%22rotate(-90 32 32)%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-family=%22Arial%22 font-size=%2228%22 font-weight=%22800%22 fill=%22%238b5cf6%22 text-anchor=%22middle%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d16; --panel:#111726; --panel2:#1a2236; --line:#212b45;
  --text:#eef1f8; --dim:#8b96ad; --soft:#c6cfdf; --acc:#5b8cff; --acc2:#8b5cf6;
  --good:#2dd4a7; --bad:#f47171; --warn:#f0a84b; --purple:#a78bfa; --cyan:#38bdf8;
}
body.light{
  --bg:#f3f5fa; --panel:#ffffff; --panel2:#e9edf6; --line:#d8dfec;
  --text:#16203a; --dim:#5c6a85; --soft:#3d4a63;
  background:#f3f5fa;
  background-image:radial-gradient(800px 400px at 15% -10%, rgba(91,140,255,.10), transparent 60%),
                   radial-gradient(700px 400px at 90% 0%, rgba(139,92,246,.07), transparent 60%);
}
body.light .card{background:#ffffff;border-color:#dde3f0;box-shadow:0 8px 22px rgba(28,44,90,.08)}
body.light .testbar{background:rgba(255,255,255,.92);border-color:#dde3f0;box-shadow:0 8px 24px rgba(28,44,90,.10)}
body.light .passage{background:#ffffff;border-color:#dde3f0;color:#33405c}
body.light input,body.light select{background:#ffffff;border-color:#cbd5e6;color:var(--text)}
body.light .btn2{background:#ffffff;border-color:#cbd5e6;color:#20304f}
body.light .btn2:hover{background:#eef2fa}
body.light .detbody{background:#f7f9fd}
body.light td{border-bottom:1px solid #e3e9f4}
body.light .planstep{border-bottom:1px solid #e3e9f4}
body.light tr:hover td{background:rgba(91,140,255,.06)}
body.light .welcomebanner{border-color:#c9d5f2 !important}
.vswitch.sun{background:#e8ecf6;border-color:#c9d3e6}
.vswitch.sun::after{left:22px;box-shadow:0 1px 4px rgba(30,50,90,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(800px 400px at 15% -10%, rgba(91,140,255,.09), transparent 60%),
                   radial-gradient(700px 400px at 90% 0%, rgba(139,92,246,.08), transparent 60%);
  background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 70px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:10px}
.logo{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.3px}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:radial-gradient(120% 200% at 0% 50%,rgba(139,92,246,.16),transparent 50%),radial-gradient(120% 200% at 100% 0%,rgba(99,102,241,.12),transparent 55%),linear-gradient(180deg,#131a2c,#101625);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:18px;
  box-shadow:0 0 0 1px rgba(139,92,246,.08),0 10px 50px rgba(99,102,241,.12),inset 0 1px 0 rgba(255,255,255,.04);animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin-bottom:14px;letter-spacing:.2px}
h3{font-size:14px;margin-bottom:8px}
.dim{color:var(--dim);font-size:13px;line-height:1.6}
button{cursor:pointer;border:none;border-radius:11px;font-weight:600;font-size:14px;font-family:inherit;transition:all .18s ease}
.btn{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;padding:12px 24px;box-shadow:0 6px 18px rgba(91,140,255,.28)}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(91,140,255,.38);filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn2{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:11px 19px}
.btn2:hover{border-color:var(--acc);background:#1e2a47;transform:translateY(-1px)}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px 15px;border-radius:11px;font-size:14px;font-family:inherit;transition:border .15s, box-shadow .15s;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.18)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.p-timing{background:#3b2f16;color:var(--warn)} .p-conf{background:#2a2145;color:var(--purple)}
.p-content{background:#3b1d22;color:var(--bad)} .p-careless{background:#123146;color:var(--cyan)}
.p-guess{background:#2b3140;color:var(--dim)} .p-ok{background:#12352a;color:var(--good)}
.pmode-select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
body.light .pmode-select{background:#ffffff;border-color:#cbd5e6;color:#20304f}
.p-read{background:#3a1330;color:#f472b6}
.testbar{display:flex;justify-content:space-between;align-items:center;background:rgba(17,23,38,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:13px 20px;margin-bottom:16px;position:sticky;top:10px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.timer{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qlayout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.qlayout.nopassage{grid-template-columns:1fr}
@media(max-width:900px){.qlayout{grid-template-columns:1fr}}
.passage{background:linear-gradient(180deg,#131a2c,#101625);border:1px solid var(--line);border-radius:18px;padding:24px;max-height:70vh;overflow-y:auto;font-size:14.5px;line-height:1.85;white-space:pre-wrap;color:var(--soft)}
.passage::-webkit-scrollbar{width:8px}
.passage::-webkit-scrollbar-thumb{background:#2a3450;border-radius:8px}
.passage::-webkit-scrollbar-track{background:transparent}
.htmlpassage{white-space:normal!important}
.htmlpassage table{max-width:100%}
.htmlpassage p{margin:0 0 14px 0;line-height:1.9;text-align:justify}
.ul{text-decoration:underline;text-decoration-color:#8b96ad;text-underline-offset:3px}
.ul-active{background:rgba(91,140,255,.20);text-decoration-color:var(--cyan);border-radius:3px}
.uq{font-size:9px;font-weight:700;color:var(--acc);vertical-align:super;margin-left:1px}
.uq-active{color:var(--cyan);background:rgba(56,189,248,.18);border-radius:3px;padding:0 2px}
.ptitle{font-size:20px;font-weight:700;color:#eef1f8;margin-bottom:14px;font-family:'Space Grotesk',sans-serif}
.choice{display:flex;gap:13px;align-items:flex-start;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s ease}
.choice:hover{border-color:var(--acc);transform:translateX(3px)}
.choice.sel{border-color:var(--acc);background:linear-gradient(90deg,rgba(91,140,255,.16),rgba(139,92,246,.10))}
.choice .ltr{font-weight:800;color:var(--acc);min-width:18px}
.underlined{text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:4px;font-style:italic;color:var(--cyan)}
.confrow{display:flex;gap:8px;align-items:center;margin:15px 0 6px;flex-wrap:wrap}
.confchip{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700}
.confchip:hover{border-color:var(--acc)}
.confchip.sel{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 4px 12px rgba(91,140,255,.35)}
.tornchip{padding:7px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700}
.tornchip:hover{border-color:var(--warn)}
.tornchip.sel{background:#3b2f16;border-color:var(--warn);color:var(--warn)}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pq{width:33px;height:33px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:700}
.pq:hover{border-color:var(--acc);color:var(--text)}
.pq.done{background:#1d2c4d;color:var(--text);border-color:var(--acc)}
.pq.cur{outline:2px solid var(--acc2);outline-offset:1px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:17px;transition:transform .18s}
.stat:hover{transform:translateY(-2px)}
.stat .v{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700}
.stat .l{font-size:10.5px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.9px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 10px;border-bottom:1px solid #1b2338;vertical-align:top}
tr:hover td{background:rgba(91,140,255,.03)}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .6s ease}
details{margin-bottom:9px}
summary{cursor:pointer;padding:13px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-size:14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;transition:border .15s}
summary:hover{border-color:var(--acc)}
summary::-webkit-details-marker{display:none}
.detbody{padding:16px;border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;font-size:13px;line-height:1.7;background:#0f1523}
.planstep{display:flex;gap:15px;padding:14px 0;border-bottom:1px solid #1b2338;align-items:flex-start}
.planstep .n{min-width:31px;height:31px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(91,140,255,.3)}
.hidden{display:none}
.notice{background:rgba(91,140,255,.07);border-left:3px solid var(--acc);padding:11px 15px;border-radius:0 10px 10px 0;font-size:12.5px;color:var(--dim);margin-top:14px;line-height:1.6}
a.link{color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
a.link:hover{color:var(--cyan)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.trajrow{display:flex;align-items:flex-end;gap:10px;height:130px;padding:10px 0}
.trajcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.trajbar{width:70%;max-width:44px;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:7px 7px 0 0;box-shadow:0 4px 14px rgba(91,140,255,.25);transition:height .5s ease}
.goalwrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.gap{font-size:13px;color:var(--dim)}
.loading{text-align:center;padding:48px;color:var(--dim);animation:pulse 1.4s infinite}

.toast{position:sticky;bottom:0;display:none}
#toastBox{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2236;border:1px solid var(--acc);color:var(--text);padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50}
#toastBox.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.skel{background:linear-gradient(180deg,#131a2c,#101625);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:18px;overflow:hidden;position:relative;min-height:110px}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(139,150,173,.07),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.skel .ln{height:14px;border-radius:7px;background:var(--panel2);margin-bottom:12px}
.emptystate{text-align:center;padding:34px 10px;color:var(--dim)}
.emptystate svg{opacity:.7;margin-bottom:12px}
.secbtn{display:flex;align-items:center;gap:9px}
.secbtn svg{flex-shrink:0}
@media print{
  body{background:#fff !important;color:#111 !important;background-image:none !important}
  header,.btn,.btn2,.notice,#toastBox{display:none !important}
  .card{background:#fff !important;border:1px solid #ddd !important;box-shadow:none !important;color:#111 !important;break-inside:avoid;animation:none !important}
  h2,.stat .v,td,th,summary,b{color:#111 !important}
  .dim,.gap,.detbody,.planstep p{color:#444 !important}
  .stat,summary,.detbody{background:#f7f8fa !important;border-color:#ddd !important}
  details{page-break-inside:avoid}
  details[open] .detbody{display:block}
}
.nav-blue{background:#3b82f6!important;border-color:#3b82f6!important;color:#fff!important}
.nav-blue:hover{background:#2f6fe0!important;box-shadow:0 6px 16px rgba(59,130,246,.35)}
.nav-yellow{background:#eab308!important;border-color:#eab308!important;color:#1a1a1a!important}
.nav-yellow:hover{background:#d4a207!important;box-shadow:0 6px 16px rgba(234,179,8,.35)}
.nav-green{background:#10b981!important;border-color:#10b981!important;color:#fff!important}
.nav-green:hover{background:#0ca678!important;box-shadow:0 6px 16px rgba(16,185,129,.35)}
.nav-red{background:#ef4444!important;border-color:#ef4444!important;color:#fff!important}
.nav-red:hover{background:#dc3a3a!important;box-shadow:0 6px 16px rgba(239,68,68,.35)}

.vswitchWrap{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:-webkit-user-select;user-select:none}
.vswitch{position:relative;width:44px;height:24px;border-radius:14px;background:#2b3654;border:1px solid var(--line);transition:background .2s ease;flex-shrink:0;display:inline-block}
.vswitch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:left .2s ease}
.vswitch.on{background:#34b978}
.vswitch.on::after{left:22px}

/* ---------- Mobile (phones) ---------- */
@media(max-width:640px){
  .wrap{padding:14px 12px 60px}
  header{margin-bottom:14px;flex-direction:column;align-items:flex-start;gap:8px}
  .logo{font-size:20px}
  #navBtns{width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;gap:6px;padding-bottom:2px}
  #navBtns button{padding:8px 10px;font-size:11.5px;white-space:nowrap;flex-shrink:0}
  #navBtns .vswitchWrap{flex-shrink:0}
  .card{padding:16px 14px;border-radius:14px}
  h2{font-size:16px}
  input,select{font-size:16px}
  #v-auth input{width:100%}
  .btn,.btn2{padding:12px 16px;font-size:14px}
  #v-auth .card{grid-template-columns:1fr !important;margin:12px auto !important}
  #v-auth .card > div:first-child{border-right:none !important;border-bottom:1px solid var(--line);padding:24px 20px !important}
  #v-auth .card > div:last-child{padding:24px 20px !important}
  .testbar{flex-wrap:wrap;gap:8px;padding:10px 12px;top:6px;border-radius:12px}
  .testbar > div:first-child{flex:1 1 100%;order:1}
  .timer{font-size:18px;order:2}
  .testbar button{order:3;padding:9px 14px;font-size:13px;margin-left:auto}
  .passage{max-height:45vh;padding:16px;font-size:14px}
  .qlayout{gap:12px}
  .confrow{flex-wrap:wrap}
  .confrow .dim{min-width:0 !important}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card svg{max-width:100%;height:auto}
  .stat .v{font-size:20px}
  .grid2{gap:12px}
  .scoresRow{flex-wrap:wrap !important;justify-content:center !important;overflow-x:visible !important;gap:14px !important}
  .ringComposite{flex:1 1 100%;display:flex;flex-direction:column;align-items:center}
  .ringSections{width:100%;justify-content:center !important;gap:12px !important}
  .ringSec > div:first-child{width:68px !important;height:68px !important}
  .ringSec svg{width:68px !important;height:68px !important}
  .ringSec .ringNum{font-size:17px !important}
  .ringSec .ringLbl{font-size:11px !important;margin-top:5px !important}
}
@media(max-width:400px){
  #navBtns button{padding:8px 10px;font-size:12px}
  .logo{font-size:18px}
}
/* ---------- Study Plan level map (exact port of study-quest-map_4, scoped .smap4) ---------- */
.smap4{--m-bg:#0a0b0e;--m-card:#14161d;--m-card2:#1a1d26;--m-border:#23262f;--m-border2:#2c303c;--m-text:#eef0f5;--m-muted:#9aa0ae;--m-indigo:#6366f1;--m-violet:#8b5cf6;--m-violet2:#a78bfa;--m-gold:#eab308;--m-green:#34d399;font-family:'Inter',var(--font-sans)}
.smap4 .m-topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 18px}
.smap4 .m-logo{font-size:22px;font-weight:800;letter-spacing:-.3px;color:var(--m-text)}
.smap4 .m-logo .maxx{color:var(--m-violet2)}
.smap4 .m-pill{font-size:13px;font-weight:600;color:var(--m-muted);background:var(--m-card);border:1px solid var(--m-border);border-radius:999px;padding:8px 16px}
.smap4 .m-card{position:relative;background:radial-gradient(120% 200% at 0% 50%,rgba(139,92,246,.16),transparent 50%),radial-gradient(120% 200% at 100% 0%,rgba(99,102,241,.12),transparent 55%),var(--m-card);border:1px solid var(--m-border);border-radius:16px;padding:24px 28px;margin-bottom:22px;box-shadow:0 0 0 1px rgba(139,92,246,.08),0 10px 50px rgba(99,102,241,.12),inset 0 1px 0 rgba(255,255,255,.04)}
.smap4 .m-card h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.smap4 .m-card .m-sub{margin-top:6px;font-size:14px;color:var(--m-muted);line-height:1.5}
.smap4 .m-banner{background:radial-gradient(120% 200% at 0% 50%,rgba(139,92,246,.16),transparent 50%),radial-gradient(120% 200% at 100% 0%,rgba(99,102,241,.12),transparent 55%),var(--m-card2)}
.smap4 .m-banner .m-meta{color:var(--m-muted);font-weight:500;font-size:13px;margin-left:8px}
.smap4 .m-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.smap4 .m-stat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--m-muted);background:var(--m-card2);border:1px solid var(--m-border);border-radius:999px;padding:7px 14px}
.smap4 .m-stat b{color:var(--m-text);font-weight:700}
.smap4 .m-dot{width:8px;height:8px;border-radius:50%}
.smap4 .m-dot.v{background:linear-gradient(135deg,var(--m-indigo),var(--m-violet))}.smap4 .m-dot.g{background:var(--m-gold)}.smap4 .m-dot.gr{background:var(--m-green)}
.smap4 .m-proglabel{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--m-muted);margin:14px 0 8px}
.smap4 .m-prog{height:14px;border-radius:999px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.22);box-shadow:inset 0 1px 3px rgba(0,0,0,.4),0 0 12px rgba(139,92,246,.12);overflow:visible;margin:0 0 26px}
.smap4 .m-prog .m-fill{height:100%;background:linear-gradient(90deg,var(--m-indigo),var(--m-violet),var(--m-violet2));border-radius:999px;transition:width .6s ease;box-shadow:0 0 10px rgba(139,92,246,.75),0 0 22px rgba(139,92,246,.45),0 0 40px rgba(99,102,241,.25)}
.smap4 #m-map{position:relative;width:100%}
.smap4 svg#m-trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* ScoreMaxx figure renderer — draws math_items.art_payload as inline SVG.
 *
 * renderArt(payload, itemId) -> SVG string, or '' if the kind is unknown.
 *
 * The item's row is the tag: stem, choices, and art_payload live on the same
 * row of math_items, so the figure is always built from the same data as the
 * question. There is no separate image store to fall out of sync.
 *
 * Deliberate properties, do not "fix":
 *   - NOT to scale. Every triangle is drawn with the same screen shape no
 *     matter its labelled numbers, because a to-scale 3-4-5 can be solved
 *     with a ruler. Every payload says "to_scale": false; a caption states it.
 *   - Greyscale only, per the Math skill (ACT's own convention).
 *   - itemId seeds small size jitter so 40 figures don't look like one
 *     photocopied triangle — the jitter never changes which side is longest
 *     visually relative to the right-angle mark's meaning.
 */

function _hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function _esc(v) {
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

var ART_STYLE = {
  stroke: "#222", strokeWidth: 2, font: "16px", fontFamily: "Georgia, 'Times New Roman', serif",
  note: "Note: figure not drawn to scale."
};

function _txt(x, y, s, anchor) {
  return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + (anchor || "middle") +
    '" dominant-baseline="central" font-family="' + ART_STYLE.fontFamily + '" font-size="' + ART_STYLE.font +
    '" fill="#111">' + _esc(s) + "</text>";
}

function _line(a, b, w) {
  return '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) +
    '" y2="' + b[1].toFixed(1) + '" stroke="' + ART_STYLE.stroke + '" stroke-width="' + (w || ART_STYLE.strokeWidth) +
    '" stroke-linecap="round"/>';
}

/* small square marking a right angle at vertex R, opening toward points P and Q */
function _sqMark(R, P, Q, size) {
  var s = size || 13;
  var u = _unit(P[0] - R[0], P[1] - R[1]), v = _unit(Q[0] - R[0], Q[1] - R[1]);
  var a = [R[0] + u[0] * s, R[1] + u[1] * s];
  var b = [R[0] + u[0] * s + v[0] * s, R[1] + u[1] * s + v[1] * s];
  var c = [R[0] + v[0] * s, R[1] + v[1] * s];
  return '<polyline points="' + a[0].toFixed(1) + ',' + a[1].toFixed(1) + ' ' + b[0].toFixed(1) + ',' + b[1].toFixed(1) +
    ' ' + c[0].toFixed(1) + ',' + c[1].toFixed(1) + '" fill="none" stroke="' + ART_STYLE.stroke + '" stroke-width="1.5"/>';
}

function _unit(x, y) { var d = Math.hypot(x, y) || 1; return [x / d, y / d]; }
function _mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
/* Label anchor for side a-b: the exact midpoint of the side, offset strictly
 * PERPENDICULAR to it (never along it), on the side away from interior point I.
 * This is what keeps every number visually centered on its own line. */
/* Approximate rendered width of a label at the figure font size. Used to keep
   long expression labels (e.g. "3x² − 5x + 4") clear of the lines they label
   and inside the card — number labels like "12 cm" never needed this. */
function _tw(s) { return String(s == null ? "" : s).length * 6.4; }

function _txtFit(x, y, s, W) {
  var half = _tw(s) / 2 + 6;
  var cx = Math.max(half, Math.min(W - half, x));
  return _txt(cx, y, s);
}

/* Outward label position that also accounts for how wide the text is: a label
   on a steep edge must clear half its own width, not a fixed 20px. */
function _sideLabelPos(a, b, I, text, pad) {
  var m = _mid(a, b);
  var n = _unit(-(b[1] - a[1]), b[0] - a[0]);
  var toI = [I[0] - m[0], I[1] - m[1]];
  if (n[0] * toI[0] + n[1] * toI[1] > 0) n = [-n[0], -n[1]];
  var d = (pad || 14) + Math.abs(n[0]) * (_tw(text) / 2) + Math.abs(n[1]) * 7;
  return [m[0] + n[0] * d, m[1] + n[1] * d];
}

function _labelPos(a, b, I, d) {
  var m = _mid(a, b);
  var n = _unit(-(b[1] - a[1]), b[0] - a[0]);          // normal to the side
  var toI = [I[0] - m[0], I[1] - m[1]];
  if (n[0] * toI[0] + n[1] * toI[1] > 0) n = [-n[0], -n[1]];  // flip outward
  return [m[0] + n[0] * d, m[1] + n[1] * d];
}

/* ── kind: right_triangle ─────────────────────────────────────────────── */
function _rightTriangle(p, seed) {
  var h = _hash(seed || "x");
  var runL = 200 + (h % 3) * 20;          // 200 | 220 | 240

  // reserved for the not-to-scale note, so the box centres in what remains —
  // anchoring to a fixed corner piled all the slack on one side.

  var o = p.right_angle_at || "lower left", R, Hp, Vp;
  if (o === "lower left")  { R = [x0, y1]; Hp = [x1, y1]; Vp = [x0, y0]; }
  if (o === "lower right") { R = [x1, y1]; Hp = [x0, y1]; Vp = [x1, y0]; }
  if (o === "upper left")  { R = [x0, y0]; Hp = [x1, y0]; Vp = [x0, y1]; }
  if (o === "upper right") { R = [x1, y0]; Hp = [x0, y0]; Vp = [x1, y1]; }

  var I = [(R[0] + Hp[0] + Vp[0]) / 3, (R[1] + Hp[1] + Vp[1]) / 3]; // interior
  var g = [];
  // white paper behind the figure — ACT figures are black-on-white, and this
  // keeps them readable on the app's dark theme without theme coupling
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  g.push(_line(R, Hp), _line(R, Vp), _line(Hp, Vp));
  if (p.right_angle_mark !== false) g.push(_sqMark(R, Hp, Vp));

  // leg_a -> horizontal, leg_b -> vertical, hypotenuse -> slant. One of the
  // three may be the string "x"; a payload with no sides (trig vertex-letter
  // items) skips side labels entirely.
  var s = p.sides || null;
  if (s) {
    var la = _labelPos(R, Hp, I, 22), lb = _labelPos(R, Vp, I, 24), lh = _labelPos(Hp, Vp, I, 24);
    g.push(_txt(la[0], la[1], s.leg_a));
    g.push(_txt(lb[0], lb[1], s.leg_b));
    g.push(_txt(lh[0], lh[1], s.hypotenuse));
  }

  // vertex letters (trig): each letter continues the line it caps, so it sits
  // centered ON that line's extension — R and Hp extend the horizontal leg,
  // Vp extends the vertical leg. Textbook convention, and what keeps letters
  // from floating diagonally off their corners.
  if (p.vertex_labels) {
    var VL = p.vertex_labels;
    var uh = _unit(R[0] - Hp[0], R[1] - Hp[1]);       // along the horizontal leg
    var uv = _unit(R[0] - Vp[0], R[1] - Vp[1]);       // along the vertical leg
    if (VL.right) g.push(_txt(R[0] + uh[0] * 20, R[1] + uh[1] * 20, VL.right));
    if (VL.h_end) g.push(_txt(Hp[0] - uh[0] * 20, Hp[1] - uh[1] * 20, VL.h_end));
    if (VL.v_end) g.push(_txt(Vp[0] - uv[0] * 20, Vp[1] - uv[1] * 20, VL.v_end));
  }

  // angle mark (trig): an arc at one acute vertex, optional label like θ
  if (p.angle_mark && (p.angle_mark.at === "h_end" || p.angle_mark.at === "v_end")) {
    var P = p.angle_mark.at === "h_end" ? Hp : Vp;
    var other = p.angle_mark.at === "h_end" ? Vp : Hp;
    var u1 = _unit(R[0] - P[0], R[1] - P[1]);
    var u2 = _unit(other[0] - P[0], other[1] - P[1]);
    var ar = 30;
    var p1 = [P[0] + u1[0] * ar, P[1] + u1[1] * ar];
    var p2 = [P[0] + u2[0] * ar, P[1] + u2[1] * ar];
    var sweep = (u1[0] * u2[1] - u1[1] * u2[0]) > 0 ? 1 : 0;
    g.push('<path d="M ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) +
           ' A ' + ar + ' ' + ar + ' 0 0 ' + sweep + ' ' + p2[0].toFixed(1) + ' ' +
           p2[1].toFixed(1) + '" fill="none" stroke="' + ART_STYLE.stroke + '" stroke-width="1.5"/>');
    if (p.angle_mark.label) {
      var bis = _unit(u1[0] + u2[0], u1[1] + u2[1]);
      g.push(_txt(P[0] + bis[0] * (ar + 16), P[1] + bis[1] * (ar + 16), p.angle_mark.label));
    }
  }
  g.push(_txt(W / 2, H - 14, ART_STYLE.note));

  var aria = s ? "right triangle, sides " + _esc(s.leg_a) + ", " + _esc(s.leg_b) +
                 ", hypotenuse " + _esc(s.hypotenuse)
               : "right triangle" + (p.vertex_labels ?
                 " " + _esc((p.vertex_labels.v_end||"") + (p.vertex_labels.right||"") + (p.vertex_labels.h_end||"")) : "");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">' + g.join("") + "</svg>";
}

/* ── kind: two_right_triangles ────────────────────────────────────────── */
function _twoRightTriangles(p, seed) {
  var W = 400, H = 280;
  // Fixed layout: right angle at B is genuinely square on screen (AB vertical,
  // BC horizontal) and D sits on the perpendicular to CA at C, so both marks
  // look honest even though lengths are not to scale.
  var A = [58, 52], B = [58, 208], C = [258, 208];
  var ca = _unit(A[0] - C[0], A[1] - C[1]);         // C -> A
  var perp = [-ca[1], ca[0]];                        // rotate 90°: points up-right
  var t = 118 + (_hash(seed || "x") % 3) * 10;
  var D = [C[0] + perp[0] * t, C[1] + perp[1] * t];

  // centre the whole quadrilateral in the card (note strip reserved below)
  var xs = [A[0], B[0], C[0], D[0]], ys = [A[1], B[1], C[1], D[1]];
  var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs);
  var miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
  var dx = (W - (maxx - minx)) / 2 - minx, dy = ((H - 34) - (maxy - miny)) / 2 - miny;
  A = [A[0] + dx, A[1] + dy]; B = [B[0] + dx, B[1] + dy];
  C = [C[0] + dx, C[1] + dy]; D = [D[0] + dx, D[1] + dy];

  var V = p.vertices || ["A", "B", "C", "D"];
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  g.push(_line(A, B), _line(B, C), _line(C, D), _line(A, D));
  g.push(_line(A, C, 1.6));                          // the shared diagonal — never labelled
  g.push(_sqMark(B, A, C));
  g.push(_sqMark(C, A, D));

  // vertex letters, pushed outward from the figure's centroid
  var I = [(A[0] + B[0] + C[0] + D[0]) / 4, (A[1] + B[1] + C[1] + D[1]) / 4];
  [[A, V[0]], [B, V[1]], [C, V[2]], [D, V[3]]].forEach(function (pair) {
    var u = _unit(pair[0][0] - I[0], pair[0][1] - I[1]);
    g.push(_txt(pair[0][0] + u[0] * 16, pair[0][1] + u[1] * 16 + 5, pair[1]));
  });

  // side labels: only the sides present in `given` — the asked side stays bare,
  // matching stems that never mention an x.
  var seg = {};
  seg[V[0] + V[1]] = [A, B]; seg[V[1] + V[2]] = [B, C];
  seg[V[2] + V[3]] = [C, D]; seg[V[0] + V[3]] = [A, D];
  var given = p.given || {};
  Object.keys(given).forEach(function (k) {
    var e = seg[k]; if (!e) return;
    var lp = _labelPos(e[0], e[1], I, 24);
    g.push(_txt(lp[0], lp[1], given[k]));
  });
  g.push(_txt(W / 2, H - 12, ART_STYLE.note));

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="quadrilateral ' + _esc(V.join("")) +
    ' with right angles at ' + _esc(V[1]) + ' and ' + _esc(V[2]) + '">' + g.join("") + "</svg>";
}

/* ── entry point ──────────────────────────────────────────────────────── */

/* ── kind: table — x/y values on the same line (concept 1 surface d) ────── */
function _xyTable(p) {
  var xs = p.x, ys = p.y, n = xs.length;
  var W = 380, H = 90 + 46;
  var colW = Math.min(70, (W - 100) / n), x0 = (W - (colW * n + 56)) / 2;
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  var rows = [["x", xs], ["y", ys]];
  for (var r = 0; r < 2; r++) {
    var y = 34 + r * 34;
    g.push(_txt(x0 + 26, y, rows[r][0]));
    for (var c = 0; c < n; c++)
      g.push(_txt(x0 + 56 + colW * c + colW / 2, y, rows[r][1][c]));
  }
  // grid lines
  var top = 16, bot = 16 + 68, right = x0 + 56 + colW * n;
  g.push(_line([x0, top], [right, top], 1.5));
  g.push(_line([x0, top + 34], [right, top + 34], 1.5));
  g.push(_line([x0, bot], [right, bot], 1.5));
  g.push(_line([x0 + 52, top], [x0 + 52, bot], 1.5));
  for (var c2 = 1; c2 < n; c2++)
    g.push(_line([x0 + 56 + colW * c2 - 2, top], [x0 + 56 + colW * c2 - 2, bot], 1));
  g.push(_line([x0, top], [x0, bot], 1.5));
  g.push(_line([right, top], [right, bot], 1.5));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="table of x and y values">' + g.join("") + "</svg>";
}

/* ── kind: fx_table — x, f(x), g(x) (concept 8 surface d) ───────────────── */
function _fxTable(p) {
  var xs = p.x, n = xs.length;
  var W = 380, H = 90 + 80;
  var colW = Math.min(64, (W - 110) / n), x0 = (W - (colW * n + 64)) / 2;
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  var rows = [["x", xs], ["f(x)", p.f], ["g(x)", p.g]];
  var top = 16, rh = 34, bot = top + rh * 3;
  for (var r = 0; r < 3; r++) {
    var y = top + 18 + r * rh;
    g.push(_txt(x0 + 30, y, rows[r][0]));
    for (var c = 0; c < n; c++)
      g.push(_txt(x0 + 64 + colW * c + colW / 2, y, rows[r][1][c]));
  }
  var right = x0 + 64 + colW * n;
  for (var r2 = 0; r2 <= 3; r2++)
    g.push(_line([x0, top + rh * r2], [right, top + rh * r2], r2 === 0 || r2 === 3 ? 1.5 : 1));
  g.push(_line([x0, top], [x0, bot], 1.5));
  g.push(_line([x0 + 60, top], [x0 + 60, bot], 1.5));
  g.push(_line([right, top], [right, bot], 1.5));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="table of f and g values">' + g.join("") + "</svg>";
}

/* ── kind: grid — coordinate plane, two marked points, the line through them
   Unlike every other figure, this one IS to scale: the student reads the
   coordinates off the picture, so the points must sit exactly where they say. */
function _grid(p) {
  var pts = p.points;
  var W = 380, H = 380, pad = 28;
  var R = 10;                                    // covers -10..10
  var sc = (W - 2 * pad) / (2 * R);
  function X(v) { return pad + (v + R) * sc; }
  function Y(v) { return H - pad - (v + R) * sc; }
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  // light gridlines
  for (var i = -R; i <= R; i++) {
    var w = i === 0 ? 0 : 0.6;
    if (i !== 0) {
      g.push('<line x1="' + X(i) + '" y1="' + Y(-R) + '" x2="' + X(i) + '" y2="' + Y(R) + '" stroke="#d8d8d8" stroke-width="0.6"/>');
      g.push('<line x1="' + X(-R) + '" y1="' + Y(i) + '" x2="' + X(R) + '" y2="' + Y(i) + '" stroke="#d8d8d8" stroke-width="0.6"/>');
    }
  }
  // axes
  g.push(_line([X(-R), Y(0)], [X(R), Y(0)], 1.6));
  g.push(_line([X(0), Y(-R)], [X(0), Y(R)], 1.6));
  // small tick labels at ±5, ±10
  [[5,0],[10,0],[-5,0],[-10,0]].forEach(function (t) {
    g.push('<text x="' + X(t[0]) + '" y="' + (Y(0) + 14) + '" text-anchor="middle" font-size="9px" font-family="' + ART_STYLE.fontFamily + '" fill="#666">' + t[0] + "</text>");
  });
  [[0,5],[0,10],[0,-5],[0,-10]].forEach(function (t) {
    g.push('<text x="' + (X(0) - 10) + '" y="' + (Y(t[1]) + 3) + '" text-anchor="middle" font-size="9px" font-family="' + ART_STYLE.fontFamily + '" fill="#666">' + t[1] + "</text>");
  });
  // the line through the two points, extended to the plot edges
  var a = pts[0], b = pts[1];
  var dx = b[0] - a[0], dy = b[1] - a[1];
  var t1 = 100, pA = [a[0] - dx * t1, a[1] - dy * t1], pB = [a[0] + dx * t1, a[1] + dy * t1];
  // clip roughly by drawing within the box via clip-path
  g.push('<clipPath id="gclip"><rect x="' + pad + '" y="' + pad + '" width="' + (W - 2 * pad) + '" height="' + (H - 2 * pad) + '"/></clipPath>');
  g.push('<line clip-path="url(#gclip)" x1="' + X(pA[0]) + '" y1="' + Y(pA[1]) + '" x2="' + X(pB[0]) + '" y2="' + Y(pB[1]) + '" stroke="' + ART_STYLE.stroke + '" stroke-width="2"/>');
  // marked points with coordinate labels
  pts.forEach(function (pt) {
    g.push('<circle cx="' + X(pt[0]) + '" cy="' + Y(pt[1]) + '" r="4.5" fill="#111"/>');
    var lx = X(pt[0]) + (pt[0] >= 0 ? -8 : 8);
    var anchor = pt[0] >= 0 ? "end" : "start";
    g.push('<text x="' + lx + '" y="' + (Y(pt[1]) - 9) + '" text-anchor="' + anchor + '" font-size="13px" font-family="' + ART_STYLE.fontFamily + '" fill="#111">(' + pt[0] + ', ' + pt[1] + ')</text>');
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="coordinate plane with two marked points">' + g.join("") + "</svg>";
}

/* ── kind: rect — labeled rectangle (area/perimeter cost items) ───────── */
function _rectFig(p, seed) {
  var W = 380, H = 280, h = _hash(seed || "x");
  var rw = 190 + (h % 3) * 18;            // 190 | 208 | 226 — leaves label room
  // a long width label sits to the right of the box; shrink the box to fit it
  var _need = _tw(p.w) + 34;
  while (rw > 120 && (W + rw) / 2 - 12 + _need > W - 8) rw -= 10;
  var rh = 118 + ((h >> 4) % 3) * 14;     // 118 | 132 | 146
  var x0 = (W - rw) / 2 - 12, x1 = x0 + rw;
  var y0 = ((H - 34) - rh) / 2, y1 = y0 + rh;
  var TL = [x0, y0], TR = [x1, y0], BR = [x1, y1], BL = [x0, y1];
  var I = [(x0 + x1) / 2, (y0 + y1) / 2];
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  g.push(_line(TL, TR), _line(TR, BR), _line(BR, BL), _line(BL, TL));
  var lb = _labelPos(BL, BR, I, 22);      // long side label, centered under its line
  var ls = _labelPos(TR, BR, I, 16);      // short side label, centered beside its line
  g.push(_txtFit(lb[0], lb[1], p.l, W));
  g.push(_txt(ls[0], ls[1], p.w, "start"));
  g.push(_txt(W / 2, H - 14, ART_STYLE.note));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="rectangle ' +
    _esc(p.l) + ' by ' + _esc(p.w) + '">' + g.join("") + "</svg>";
}

/* ── kind: box — oblique rectangular box (volume cost items) ──────────── */
function _boxFig(p, seed) {
  var W = 380, H = 280, h = _hash(seed || "x");
  var fw = 148 + (h % 3) * 12;            // front-face width
  var fh = 86 + ((h >> 4) % 3) * 10;      // front-face height (the depth dim)
  var ox = 46, oy = -34;                  // receding offset
  var totH = fh - oy;
  var x0 = 88, y1 = ((H - 34) + totH) / 2, y0 = y1 - fh;   // fixed left gutter fits any depth label
  var A = [x0, y1], B = [x0 + fw, y1], C = [x0 + fw, y0], D = [x0, y0];   // front
  var E = [D[0] + ox, D[1] + oy], F2 = [C[0] + ox, C[1] + oy], G = [B[0] + ox, B[1] + oy];
  var I = [(A[0] + G[0]) / 2, (A[1] + F2[1]) / 2];
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  g.push(_line(A, B), _line(B, C), _line(C, D), _line(D, A));   // front face
  g.push(_line(D, E), _line(C, F2), _line(B, G));               // receding edges
  g.push(_line(E, F2), _line(F2, G));                           // back top + right
  var ll = _labelPos(A, B, I, 22);        // length under the front-bottom edge
  var lw = _labelPos(B, G, I, 14);        // width along the receding edge
  var ld = _labelPos(A, D, I, 12);        // depth beside the front-left edge
  g.push(_txt(ll[0], ll[1], p.l));
  g.push(_txt(lw[0], lw[1], p.w, "start"));
  g.push(_txt(ld[0], ld[1], p.d, "end"));
  g.push(_txt(W / 2, H - 14, ART_STYLE.note));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="rectangular box ' +
    _esc(p.l) + ' by ' + _esc(p.w) + ', depth ' + _esc(p.d) + '">' + g.join("") + "</svg>";
}

/* ── kind: count_table — category/count table (probability items) ──────── */
function _countTable(p) {
  var rows = p.rows, n = rows.length;
  var W = 380, rowH = 30, top = 16;
  var H = top + rowH * (n + 1) + 26;
  var x0 = 34, x1 = W - 34, xm = x0 + (x1 - x0) * 0.52;
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  var hy = top + rowH / 2;
  var hd = function(x, s){ return '<text x="' + x.toFixed(1) + '" y="' + hy.toFixed(1) +
    '" text-anchor="middle" dominant-baseline="central" font-family="' + ART_STYLE.fontFamily +
    '" font-size="13.5px" fill="#111">' + _esc(s) + '</text>'; };
  g.push(hd((x0 + xm) / 2, p.col1));
  g.push(hd((xm + x1) / 2, p.col2));
  for (var r = 0; r < n; r++) {
    var y = top + rowH * (r + 1) + rowH / 2;
    g.push(_txt((x0 + xm) / 2, y, rows[r][0]));
    g.push(_txt((xm + x1) / 2, y, rows[r][1]));
  }
  for (var i = 0; i <= n + 1; i++)
    g.push(_line([x0, top + rowH * i], [x1, top + rowH * i], i <= 1 || i === n + 1 ? 1.5 : 1));
  g.push(_line([x0, top], [x0, top + rowH * (n + 1)], 1.5));
  g.push(_line([xm, top], [xm, top + rowH * (n + 1)], 1.5));
  g.push(_line([x1, top], [x1, top + rowH * (n + 1)], 1.5));
  var aria = p.col1 + " table: " + rows.map(function(r){ return r[0] + " " + r[1]; }).join(", ");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + _esc(aria) + '">' + g.join("") + "</svg>";
}

/* ── kind: numline — two labeled points on a number line (not to scale) ── */
function _numLine(p) {
  var W = 380, H = 150;
  var y = 62, x0 = 40, x1 = W - 40;
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  g.push(_line([x0, y], [x1, y], 2));
  // arrowheads
  g.push('<path d="M ' + (x0 + 10) + ' ' + (y - 6) + ' L ' + x0 + ' ' + y + ' L ' + (x0 + 10) + ' ' + (y + 6) + '" fill="none" stroke="' + ART_STYLE.stroke + '" stroke-width="2" stroke-linecap="round"/>');
  g.push('<path d="M ' + (x1 - 10) + ' ' + (y - 6) + ' L ' + x1 + ' ' + y + ' L ' + (x1 - 10) + ' ' + (y + 6) + '" fill="none" stroke="' + ART_STYLE.stroke + '" stroke-width="2" stroke-linecap="round"/>');
  var xa = x0 + (x1 - x0) * 0.28, xb = x0 + (x1 - x0) * 0.72;
  [[xa, p.a], [xb, p.b]].forEach(function(dp) {
    g.push('<circle cx="' + dp[0].toFixed(1) + '" cy="' + y + '" r="5" fill="#222"/>');
    g.push(_txt(dp[0], y + 26, dp[1]));
  });
  g.push(_txt(W / 2, H - 14, ART_STYLE.note));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="number line with points ' +
    _esc(p.a) + ' and ' + _esc(p.b) + '">' + g.join("") + "</svg>";
}

/* ── kind: angle_line — two angles on a straight line (not to scale) ────── */
function _angleLine(p) {
  var W = 380, H = 220;
  var cx = W / 2, cy = 150, x0 = 40, x1 = W - 40;
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  g.push(_line([x0, cy], [x1, cy], 2));
  var ang = 118 * Math.PI / 180;          // the ray, up-left of vertical
  var rx = cx + Math.cos(ang) * 105, ry = cy - Math.sin(ang) * 105;
  g.push(_line([cx, cy], [rx, ry], 2));
  // arcs: left angle (between ray and left arm), right angle (ray to right arm)
  var r1 = 34, r2 = 46;
  var aL = Math.PI - 0, aR = 0;
  function arcTo(r, from, to) {
    var p1 = [cx + Math.cos(from) * r, cy - Math.sin(from) * r];
    var p2 = [cx + Math.cos(to) * r, cy - Math.sin(to) * r];
    return '<path d="M ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) +
      ' A ' + r + ' ' + r + ' 0 0 1 ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) +
      '" fill="none" stroke="' + ART_STYLE.stroke + '" stroke-width="1.5"/>';
  }
  g.push(arcTo(r1, ang, 0));              // right angle arc (ray → right arm)

/* ── kind: circle_fig — circle with radius or diameter, optional arc angle ── */

    g.push('<path d="M ' + q1[0].toFixed(1) + ' ' + q1[1].toFixed(1) + ' A ' + ar + ' ' + ar +
           ' 0 ' + large + ' 0 ' + q2[0].toFixed(1) + ' ' + q2[1].toFixed(1) + '" fill="none" stroke="' + ART_STYLE.stroke + '" stroke-width="1.5"/>');
    var mid = (a1 + a2) / 2;

  }
  for (i = 0; i < nc; i++)
    g.push(cell((xs[i] + xs[i + 1]) / 2, top + rowH / 2, cols[i], true));
  for (r = 0; r < nr; r++) {
    var cy = top + rowH * (r + 1) + rowH / 2;
    var isTot = r === nr - 1 && p.totalRow !== false;
    for (i = 0; i < nc; i++)
      g.push(cell((xs[i] + xs[i + 1]) / 2, cy, rows[r][i],
                  isTot || i === 0 || (i === nc - 1 && p.totalCol !== false)));
  }
  var yTop = top, yBot = top + rowH * (nr + 1);
  for (r = 0; r <= nr + 1; r++) {
    var y = top + rowH * r;
    var heavy = (r <= 1 || r === nr + 1 || (p.totalRow !== false && r === nr));
    g.push(_line([x0, y], [x1, y], heavy ? 1.6 : 0.9));
  }
  for (i = 0; i <= nc; i++) {
    var x = i < xs.length ? xs[i] : x1;
    var hv = (i === 0 || i === 1 || i === nc || (p.totalCol !== false && i === nc - 1));
    g.push(_line([x, yTop], [x, yBot], hv ? 1.6 : 0.9));
  }
  var aria = "two-way table. " + cols.join(", ") + ". " +
    rows.map(function(rr){ return rr.join(" "); }).join(". ");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + _esc(aria) + '">' + g.join("") + "</svg>";
}

function _ineqLine(p) {
  var lo = p.min, hi = p.max, pts = p.points || [];
  var W = 380, H = 96, x0 = 26, x1 = W - 26, y = 46;
  var sx = function (v) { return x0 + (x1 - x0) * (v - lo) / (hi - lo); };
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  // shaded solution region, drawn first so the ticks sit on top
  var seg = null;
  if (p.between && pts.length === 2) {
    seg = [sx(pts[0].v), sx(pts[1].v)];
  } else if (pts.length === 1) {
    seg = p.dir === "left" ? [x0 + 6, sx(pts[0].v)] : [sx(pts[0].v), x1 - 6];
  }
  if (seg) {
    g.push('<line x1="' + seg[0].toFixed(1) + '" y1="' + y + '" x2="' + seg[1].toFixed(1) +
           '" y2="' + y + '" stroke="' + ART_STYLE.stroke + '" stroke-width="4.5"/>');
    if (!p.between) {
      var ax = p.dir === "left" ? x0 + 6 : x1 - 6, s = p.dir === "left" ? 1 : -1;
      g.push('<path d="M ' + ax + ' ' + y + ' l ' + (s * 9) + ' -5 l 0 10 z" fill="' +
             ART_STYLE.stroke + '"/>');
    }
  }
  // axis with a tick and label at every integer
  g.push('<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y +
         '" stroke="' + ART_STYLE.stroke + '" stroke-width="1.4"/>');
  var step = (hi - lo) > 14 ? 2 : 1;
  for (var v = lo; v <= hi; v += step) {
    var X = sx(v);
    g.push('<line x1="' + X.toFixed(1) + '" y1="' + (y - 5) + '" x2="' + X.toFixed(1) +
           '" y2="' + (y + 5) + '" stroke="' + ART_STYLE.stroke + '" stroke-width="1.1"/>');
    g.push('<text x="' + X.toFixed(1) + '" y="' + (y + 22) +
           '" text-anchor="middle" font-family="' + ART_STYLE.fontFamily +
           '" font-size="11.5px" fill="#111">' + String(v).replace("-", "\u2212") + '</text>');
  }
  // endpoint dots: filled = included, hollow = excluded
  for (var i = 0; i < pts.length; i++) {
    var px = sx(pts[i].v);
    g.push('<circle cx="' + px.toFixed(1) + '" cy="' + y + '" r="5.2" fill="' +
           (pts[i].closed ? ART_STYLE.stroke : "#ffffff") + '" stroke="' +
           ART_STYLE.stroke + '" stroke-width="2"/>');
  }
  var aria = "number line from " + lo + " to " + hi + " with the solution shaded";
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">' + g.join("") + "</svg>";
}

/* ── kind: sim_pair — two similar triangles side by side, not to scale ──
   Each triangle takes {v: vertical/left label, h: horizontal/base label,
   name: caption}. `right` draws the right-angle marks (shadow problems). */
function _simPair(p) {
  var W = 380, H = 230;
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  // baseline sits high in the card: the stacked base label + caption below the
  // triangles were crowding the "not to scale" note, while the top was empty
  var yB = 136;
  function draw(cx, hh, bw, t, isRight) {
    var B = [cx - bw / 2, yB], C = [cx + bw / 2, yB], A = [cx - bw / 2, yB - hh];
    g.push(_line(A, B, 1.8), _line(B, C, 1.8), _line(A, C, 1.8));
    if (isRight) {
      var s = 9;
      g.push('<path d="M ' + (B[0]) + ' ' + (B[1] - s) + ' h ' + s + ' v ' + s +
             '" fill="none" stroke="' + ART_STYLE.stroke + '" stroke-width="1.3"/>');
    }
    if (t.v) g.push(_txtFit(B[0] - _tw(t.v) / 2 - 7, yB - hh / 2, t.v, W));
    if (t.h) g.push(_txtFit(cx, yB + 18, t.h, W));
    if (t.name) g.push(_txtFit(cx, yB + 37, t.name, W));
  }
  draw(96, 62, 96, p.t1 || {}, p.right !== false);
  draw(272, 104, 132, p.t2 || {}, p.right !== false);
  g.push(_txt(W / 2, H - 12, ART_STYLE.note));
  var aria = "two similar triangles, not to scale";
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">' + g.join("") + "</svg>";
}

/* ── kind: tri_parallel — triangle ABC with DE parallel to BC ──
   Labels: ad, db (on AB), ae, ec (on AC), and optionally de / bc. */
function _triParallel(p) {
  var W = 380, H = 250;
  var A = [150, 34], B = [46, 196], C = [318, 196];
  // D and E sit partway down each side; the split is visual only, never to scale
  var f = 0.42;
  var D = [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f];
  var E = [A[0] + (C[0] - A[0]) * f, A[1] + (C[1] - A[1]) * f];
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  g.push(_line(A, B, 1.8), _line(B, C, 1.8), _line(C, A, 1.8), _line(D, E, 1.8));
  var I = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
  function vlab(V, t, dx, dy) {
    g.push(_txt(V[0] + dx, V[1] + dy, t));
  }
  var V = p.v || ["A", "B", "C", "D", "E"];
  vlab(A, V[0], 0, -11); vlab(B, V[1], -12, 6); vlab(C, V[2], 12, 6);
  vlab(D, V[3], -13, 2);  vlab(E, V[4], 13, 2);
  function seg(P, Q, t, out) {
    if (!t) return;
    var m = _mid(P, Q);
    var nx = -(Q[1] - P[1]), ny = Q[0] - P[0];
    var L = Math.sqrt(nx * nx + ny * ny) || 1;
    nx /= L; ny /= L;
    if ((nx * (I[0] - m[0]) + ny * (I[1] - m[1])) > 0 === out) { nx = -nx; ny = -ny; }
    var d = 13 + Math.abs(nx) * _tw(t) / 2;
    g.push(_txtFit(m[0] + nx * d, m[1] + ny * d + 4, t, W));
  }
  seg(A, D, p.ad, true); seg(D, B, p.db, true);
  seg(A, E, p.ae, true); seg(E, C, p.ec, true);
  if (p.de) g.push(_txt((D[0] + E[0]) / 2, D[1] - 9, p.de));
  if (p.bc) g.push(_txt((B[0] + C[0]) / 2, B[1] + 19, p.bc));
  g.push(_txt(W / 2, H - 12, ART_STYLE.note));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="triangle ABC with DE parallel to BC">' + g.join("") + "</svg>";
}

/* ── kind: factor_tree — a worked factor tree, used only by the worked-example
   panel (never by a live item, whose radicand is reserved out of the bank). ── */
function _factorTree(p) {
  var W = 380, H = 250;
  var g = [];
  g.push('<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="#ffffff" rx="10"/>');
  var root = [190, 34], L = [110, 104], R = [270, 104];
  var LL = [64, 174], LR = [156, 174];
  g.push(_line(root, L, 1.4), _line(root, R, 1.4), _line(L, LL, 1.4), _line(L, LR, 1.4));
  function node(pt, t, bold) {
    g.push('<circle cx="' + pt[0] + '" cy="' + pt[1] + '" r="19" fill="#ffffff" stroke="' +
           ART_STYLE.stroke + '" stroke-width="' + (bold ? 2.2 : 1.4) + '"/>');
    g.push('<text x="' + pt[0] + '" y="' + (pt[1] + 5) + '" text-anchor="middle" font-family="' +
           ART_STYLE.fontFamily + '" font-size="14px" fill="#111"' +
           (bold ? ' font-weight="600"' : '') + '>' + _esc(t) + '</text>');
  }
  node(root, String(p.n), true);
  node(L, String(p.a), true);
  node(R, String(p.b));
  node(LL, String(p.a1));
  node(LR, String(p.a2));
  g.push(_txt(L[0], 210, "perfect square"));
  g.push(_txt(R[0], 140, "what is left"));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="factor tree for ' +
    p.n + '">' + g.join("") + "</svg>";
}

function renderArt(payload, itemId) {
  if (!payload) return "";
  var kind = payload.kind || payload.type;    // concept-1 payloads use "type"
  if (kind === "right_triangle")      return _rightTriangle(payload, itemId);
  if (kind === "two_right_triangles") return _twoRightTriangles(payload, itemId);
  if (kind === "table")               return _xyTable(payload);
  if (kind === "fx_table")            return _fxTable(payload);
  if (kind === "grid")                return _grid(payload);
  if (kind === "rect")                return _rectFig(payload, itemId);
  if (kind === "box")                 return _boxFig(payload, itemId);
  if (kind === "count_table")         return _countTable(payload);
  if (kind === "numline")             return _numLine(payload);
  if (kind === "angle_line")          return _angleLine(payload);
  if (kind === "tri_angles")          return _triAngles(payload, itemId);
  if (kind === "parallel_cut")        return _parallelCut(payload);
  if (kind === "pgram")               return _pgram(payload, itemId);
  if (kind === "cylinder")            return _cylinder(payload);
  if (kind === "cone")                return _cone(payload);
  if (kind === "sphere")              return _sphere(payload);
  if (kind === "circle_fig")          return _circleFig(payload);
  if (kind === "tape")                return _tapeFig(payload);
  if (kind === "bar")                 return _barGraph(payload);
  if (kind === "twoway")              return _twoWay(payload);
  if (kind === "ineq_line")           return _ineqLine(payload);
  if (kind === "sim_pair")            return _simPair(payload);
  if (kind === "tri_parallel")        return _triParallel(payload);
  if (kind === "factor_tree")         return _factorTree(payload);
  return "";
}

function swapAuth(){
  signupMode = !signupMode;
  document.getElementById('authTitle').textContent = signupMode?'Create account':'Sign in';
  document.getElementById('authBtn').textContent = signupMode?'Create account':'Sign in';
  document.getElementById('authName').classList.toggle('hidden', !signupMode);

async function doAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const errEl = document.getElementById('authErr'); errEl.textContent='';
  try{
    if(signupMode){
      const name = document.getElementById('authName').value.trim();
      const {data, error} = await db.auth.signUp({email, password:pass, options:{data:{full_name:name}}});
      if(error) throw error;
      if(!data.session){ errEl.textContent='Check your email for a confirmation link, then sign in.'; return; }
    } else {
      const {error} = await db.auth.signInWithPassword({email, password:pass});
      if(error) throw error;
    }
    await boot();
  }catch(e){ errEl.textContent = describeError(e); }
}
function describeError(e){
  if(!e) return 'Unknown error';
  const m = e.message || e.error_description || e.msg;
  if(m && m !== '{}') return m;
  if(e.name==='AuthRetryableFetchError' || m==='{}' || e.status===0)
    return 'Could not reach the ScoreMaxx database. Check your internet connection — if it persists, the project URL may be wrong or the Supabase project is paused.';
  try{ return JSON.stringify(e); }catch(_){ return String(e); }
}

}

async function boot(){
  if(RESET_MODE){ showResetMode(); return; }
  const {data:{user}} = await db.auth.getUser();
  if(!user){ go('auth'); return; }
  let {data:prof} = await db.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if(!prof){
    const {error:insErr} = await db.from('profiles').upsert({id:user.id, full_name:user.user_metadata?.full_name||''});
    prof = (await db.from('profiles').select('*').eq('id', user.id).maybeSingle()).data;
    if(!prof) throw new Error('Your account exists but its profile could not be created ('+(insErr?.message||'unknown')+'). Ask your tutor to check the database.');
  }
  ME = prof; ME.email = user.email;

  // ---------- PAYWALL GATE ----------
  const qp = new URLSearchParams(location.search);
  const co = qp.get('checkout');
  if(co){ history.replaceState({},'',location.pathname); }
  if(co==='success' && !hasAccess()){
    renderPaywall('activating'); go('paywall'); renderNav();
    const ok = await waitForActivation(user.id);
    if(!ok){ renderPaywall('slow'); return; }
  }
  if(!hasAccess()){ renderPaywall(); go('paywall'); renderNav(); return; }

  const [{data:tests},{data:presc}] = await Promise.all([
    db.from('tests').select('*').order('name'),
    db.from('prescriptions').select('skill,teach,drill')
  ]);
  TESTS = tests||[];
  PRESC = {}; (presc||[]).forEach(p=>{ PRESC[p.skill]={teach:p.teach, drill:p.drill}; });
  renderNav();
  await renderHome();
  go('home');
}

// ---------- TEST ENGINE ----------
// anchors for insert/placement questions that have no in-passage underline:
// map a snippet of the question stem's added sentence to where it sits in the passage
const INSERT_ANCHORS = {
  'The melody has become so familiar': 'I hear the opening notes of a local folk melody.',
  'A similar musical roadway exists': "Whether the experiment has changed driving habits, I can't say.",
  'This approach also helps preserve delicate collections': 'lets museums rotate collections more efficiently.',
  'best build on the ideas presented': 'community art centers throughout New Mexico.'
};
function readingPos(q){
  const body = (q.passages && q.passages.body) || '';
  const flat = body.replace(/\s+/g,' ');
  if(q.underlined_text){
    const u = q.underlined_text.replace(/\s+/g,' ').trim();
    const i = flat.indexOf(u);
    if(i>=0) return i;
    // insert/placement: try anchor by matching a stem/added-sentence snippet
    for(const key in INSERT_ANCHORS){
      if((q.stem||'').indexOf(key)>=0 || (q.underlined_text||'').indexOf(key)>=0){
        const a = flat.indexOf(INSERT_ANCHORS[key]);
        if(a>=0) return a + INSERT_ANCHORS[key].length + 0.5; // just after the anchor
      }
    }
  }
  return 1e9;   // unknown → end of passage group
}
function orderByReading(qs){
  // keep passages in their existing appearance order; sort questions within each passage by reading position
  const order = [], seen = [];
  qs.forEach(q=>{ const pid=(q.passages&&q.passages.id)||('none-'+q.id); if(!seen.includes(pid)) seen.push(pid); });
  seen.forEach(pid=>{
    const grp = qs.filter(q=>((q.passages&&q.passages.id)||('none-'+q.id))===pid);
    grp.sort((a,b)=>readingPos(a)-readingPos(b));
    order.push(...grp);
  });
  return order;
}
async function startTest(testId){
  if(T && T.timerId){ clearInterval(T.timerId); T.timerId = null; }
  const test = TESTS.find(t=>t.id===testId);
  const timed = document.getElementById('timedBox')?.checked ?? true;
  document.getElementById('v-home').innerHTML = skel(3);
  // (orderByReading + anchors defined below)
  const {data:tq, error} = await db.from('test_questions').select('position, questions(*, passages(id, body))').eq('test_id', testId).order('position');
  if(error || !tq?.length){ alert('Could not load test: '+(error?.message||'no questions')); renderHome(); return; }
  let qs = tq.map(x=>x.questions);
  qs.sort((a,b)=>(a.source_number||0)-(b.source_number||0));   // present in question-number order
  qs.forEach(q=>{ q._num = q.source_number; });                // labels use the real question number
  T = {
    test, timed, questions:qs, cur:0, enteredAt:null, startedAt:Date.now(), startedIso:new Date().toISOString(),
    remaining: Math.round((test.time_limit_sec || qs.length * (PACE[test.section]||45)) * (ME.extra_time ? 1.5 : 1)),
    rec: qs.map((q,i)=>({idx:i, answer:null, changes:[], time:0, conf:null, torn:[]}))
  };
  document.getElementById('secLabel').textContent = '· '+esc(test.name)+(timed?(ME.extra_time?' · timed · +50% time':' · timed'):' · untimed');
  if(timed) T.timerId = setInterval(tick,1000);
  else document.getElementById('timerEl').textContent='∞';
  showQ(0); go('test');
}
function tick(){
  T.remaining--;
  const el = document.getElementById('timerEl');
  el.textContent = fmtT(T.remaining);
  el.classList.toggle('low', T.remaining<120);
  if(T.remaining<=0) finishTest(true);
}
function stampTime(){ if(T.enteredAt!==null){ T.rec[T.cur].time += (Date.now()-T.enteredAt)/1000; } T.enteredAt = Date.now(); }
function showQ(i){
  stampTime(); T.cur=i;
  const q = T.questions[i], r = T.rec[i];
  document.getElementById('qCounter').textContent = 'Question '+(q._num||i+1)+' / '+T.questions.length;
  if(T.timed) document.getElementById('timerEl').textContent = fmtT(T.remaining);
  const lay = document.getElementById('qLayout');
  if(q.passages){
    lay.classList.remove('nopassage'); const pel=document.getElementById('passageEl'); pel.classList.remove('hidden');
    let p = q.passages.body;
    const isHtml = /<(table|div|p)\b/i.test(p);
    if(isHtml){
      pel.classList.add('htmlpassage'); pel.innerHTML = p;
    } else {
      pel.classList.add('htmlpassage');
      // title + paragraphs (prefer blank-line splits; fall back to short-line heuristic)
      let lines = p.split('\n');
      const title = lines[0].trim();
      let paras;
      if(p.indexOf('\n\n')>=0){
        paras = p.split(/\n\s*\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
        paras.shift();  // drop title paragraph
      } else {
        paras = []; let cur=[];
        lines.slice(1).forEach(ln=>{ const t=ln.trim(); if(!t) return; cur.push(t); if(t.length<72){paras.push(cur.join(' ')); cur=[];} });
        if(cur.length) paras.push(cur.join(' '));
      }
      // gather all questions for this passage; number each by its real question number
      const pid = q.passages.id;
      const sibs = T.questions.filter(x=>x.passages && x.passages.id===pid);
      function anchorFor(x){   // returns the passage snippet an insert/placement question sits after
        for(const key in INSERT_ANCHORS){
          if((x.stem||'').indexOf(key)>=0 || (x.underlined_text||'').indexOf(key)>=0) return INSERT_ANCHORS[key];
        }
        return null;
      }
      function renderPara(text){
        const norm = text.replace(/\s+/g,' ');
        const hits = [];
        sibs.forEach(x=>{
          const u = x.underlined_text ? x.underlined_text.replace(/\s+/g,' ').trim() : '';
          let at = u ? norm.indexOf(u) : -1;
          if(at>=0 && u.length>1){
            hits.push({at, len:u.length, num:x._num, active:x===q, mark:false});
          } else {
            const a = anchorFor(x);
            if(a){ const ai = norm.indexOf(a); if(ai>=0) hits.push({at:ai+a.length, len:0, num:x._num, active:x===q, mark:true}); }
          }
        });
        hits.sort((a,b)=>a.at-b.at || a.len-b.len);
        let out='', pos=0;
        hits.forEach(h=>{ if(h.at<pos) return;
          out += esc(norm.slice(pos,h.at));
          if(h.mark){
            out += '<sup class="uq'+(h.active?' uq-active':'')+'">'+h.num+'</sup>';
          } else {
            out += '<u class="ul'+(h.active?' ul-active':'')+'">'+esc(norm.slice(h.at,h.at+h.len))+'</u><sup class="uq'+(h.active?' uq-active':'')+'">'+h.num+'</sup>';
          }
          pos = h.at+h.len;
        });
        out += esc(norm.slice(pos));
        return '<p>'+out+'</p>';
      }
      pel.innerHTML = '<div class="ptitle">'+esc(title)+'</div>'+paras.map(renderPara).join('');
    }
  } else { lay.classList.add('nopassage'); document.getElementById('passageEl').classList.add('hidden'); }
  let stem = /<(table|div)\b/i.test(q.stem) ? q.stem : esc(q.stem).replace(/\\n/g,'<br>');
  if(q.underlined_text && !q.passages) stem = '<span class="underlined">'+esc(q.underlined_text)+'</span><br><br>'+stem;
  if(q.image_url) stem = '<img src="'+esc(q.image_url)+'" style="max-width:100%;border-radius:8px;margin-bottom:10px"><br>'+stem;
  document.getElementById('stemEl').innerHTML = stem;
  document.getElementById('choicesEl').innerHTML = LETTERS.map(L=>
    '<div class="choice'+(r.answer===L?' sel':'')+'" onclick="pick(\''+L+'\')"><span class="ltr">'+L+'</span><span>'+esc(q['answer_'+L.toLowerCase()]).replace(/\\n/g,'<br>')+'</span></div>').join('');
  document.getElementById('confChips').innerHTML = [1,2,3,4,5].map(c=>
    '<button class="confchip'+(r.conf===c?' sel':'')+'" onclick="setConf('+c+')">'+c+'</button>').join(' ');
  document.getElementById('tornChips').innerHTML = LETTERS.map(L=>
    '<button class="tornchip'+(r.torn.includes(L)?' sel':'')+'" onclick="toggleTorn(\''+L+'\')">'+L+'</button>').join(' ');
  document.getElementById('nextBtn').textContent = i===T.questions.length-1 ? 'Finish ✓' : 'Next →';
  document.getElementById('paletteEl').innerHTML = T.rec.map((rr,j)=>
    '<button class="pq'+(rr.answer?' done':'')+(j===i?' cur':'')+'" onclick="showQ('+j+')">'+(T.questions[j]._num||j+1)+'</button>').join('');
}
function refresh(){ const e=T.enteredAt; showQ(T.cur); T.enteredAt=e; }
function pick(L){
  const r = T.rec[T.cur];
  if(r.answer!==L){ if(r.answer!==null) r.changes.push({from:r.answer,to:L,at:Date.now()-T.startedAt}); r.answer=L; }
  refresh();
}
function setConf(c){ T.rec[T.cur].conf=c; refresh(); }
function toggleTorn(L){
  const r=T.rec[T.cur];
  if(r.torn.includes(L)) r.torn=r.torn.filter(x=>x!==L);
  else { r.torn.push(L); if(r.torn.length>2) r.torn.shift(); }
  refresh();
}
function nav(d){
  const r=T.rec[T.cur];
  if(d>0 && r.answer && r.conf===null) r.conf=3;
  const n=T.cur+d;
  if(n>=T.questions.length){ finishTest(false); return; }
  if(n>=0) showQ(n);
}

// ---------- DIAGNOSTIC ENGINE ----------
function classifyMiss(q, r, ctx){
  const avg = ctx.avgSec, t = r.time, conf = r.conf ?? 3;
  const diff = Number(q.difficulty||3);
  const posFrac = ctx.pos/ctx.total;
  const distr = r.answer ? (q['distractor_'+r.answer.toLowerCase()+'_type']||'') : '';
  const distrReason = r.answer ? (q['distractor_'+r.answer.toLowerCase()+'_reason']||'') : '';
  const tornHadCorrect = r.torn.length>0 && r.torn.includes(q.correct_choice);
  const wasRightThenChanged = r.changes.some(c=>c.from===q.correct_choice);
  if(Math.round(t)===0){
    if(r.answer===null) return {type:"Didn't Read", reason:'Viewed for 0 seconds and left blank — this question was never read.'};
    return {type:"Didn't Read", reason:'Answered after viewing for 0 seconds — this question was never actually read.'};
  }
  if(r.answer===null){
    if(ctx.timeExpired && posFrac>0.6) return {type:'Timing', reason:'Never reached / left blank — ran out of time near the end of the section.'};
    return {type:'Timing', reason:'Left blank. There is no penalty for guessing — never leave a question blank.'};
  }
  if(wasRightThenChanged) return {type:'Confidence', reason:'Had the correct answer ('+q.correct_choice+') selected, then changed it. First instinct was right.'};
  if(tornHadCorrect) return {type:'Confidence', reason:'Was torn between two answers and one was correct ('+q.correct_choice+'). The knowledge was there; the trust wasn’t.'};
  if(ctx.timeExpired && posFrac>0.75 && t < avg*0.4) return {type:'Timing', reason:'Rushed answer ('+Math.round(t)+'s vs ~'+avg+'s expected) in the final stretch of a timed section.'};
  if(conf<=2) return {type:'Guess', reason:'Low self-reported confidence ('+conf+'/5)'+(r.torn.length?' while torn between '+r.torn.join(' & '):'')+' — effectively a guess. Signals a content gap to build from scratch.'};
  if(t > avg*2.2) return {type:'Timing', reason:'Spent '+Math.round(t)+'s (~'+(t/avg).toFixed(1)+'× the expected '+avg+'s). Over-investing steals time from easier points later. Likely also a partial content gap.'};
  if(conf>=4 && diff<=3 && t < avg*0.65) return {type:'Careless', reason:'High confidence ('+conf+'/5), easy question (difficulty '+diff+'), answered fast ('+Math.round(t)+'s vs ~'+avg+'s expected). A rushing error, not a knowledge gap.'};
  let why = 'Normal pace and moderate-to-high confidence but wrong — points to a genuine content gap in '+(q.skill||'this skill')+'.';
  if(distr && distr!=='correct' && !/junk/i.test(distr)) why += ' Fell for the "'+distr.replace(/_/g,' ')+'" trap: '+distrReason;
  else if(distrReason) why += ' ('+distrReason+')';
  return {type:'Content', reason:why};
}
function scaleScore(p){
  const pts=[[0,1],[.15,10],[.25,13],[.35,16],[.45,18],[.55,20],[.65,22],[.72,24],[.8,27],[.87,29],[.92,31],[.96,33],[.99,35],[1,36]];
  for(let i=1;i<pts.length;i++){ if(p<=pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return Math.round(y0+(y1-y0)*(p-x0)/(x1-x0)); } }
  return 36;
}
function analyze(T, timeExpired){
  const avgSec = PACE[T.test.section]||45;
  const total = T.questions.length;
  const results = T.questions.map((q,i)=>{
    const r = T.rec[i];
    const correct = r.answer===q.correct_choice;
    let miss=null;
    if(!correct) miss = classifyMiss(q, r, {avgSec, pos:i+1, total, timeExpired});
    const fragile = correct && ((r.conf!=null && r.conf<=2) || r.torn.length>0);
    return {i, qid:q.id, skill:q.skill, sub_skill:q.sub_skill, difficulty:Number(q.difficulty||3),
      correct, answer:r.answer, correctChoice:q.correct_choice, time:Math.round(r.time*10)/10,
      conf:r.conf, torn:r.torn.slice(), changes:r.changes, miss, fragile, stem:q.stem,
      tag: r.answer&&!correct ? (q['distractor_'+r.answer.toLowerCase()+'_type']||'') : '',
      distractorReason: r.answer&&!correct ? (q['distractor_'+r.answer.toLowerCase()+'_reason']||'') : ''};
  });
  const nCorrect = results.filter(x=>x.correct).length;
  const skills = {};
  results.forEach(x=>{
    const k = x.skill||'other';
    skills[k] = skills[k]||{total:0,correct:0,fragile:0,misses:[],types:{}};
    skills[k].total++;
    if(x.correct){ skills[k].correct++; if(x.fragile) skills[k].fragile++; }
    else { skills[k].misses.push(x); skills[k].types[x.miss.type]=(skills[k].types[x.miss.type]||0)+1; }
  });
  Object.values(skills).forEach(s=>{ s.mastery = Math.round(100*(s.correct - s.fragile*0.5)/s.total); });
  const missTypes = {};
  results.filter(x=>!x.correct).forEach(x=>missTypes[x.miss.type]=(missTypes[x.miss.type]||0)+1);
  const cur = scaleScore(nCorrect/total);
  const recovery = {Content:.8, Careless:.65, Confidence:.6, Timing:.55, Guess:.4, "Didn't Read":.85};
  let recovered = 0;
  results.filter(x=>!x.correct).forEach(x=>recovered += recovery[x.miss.type]||.5);
  const pred = scaleScore(Math.min(1,(nCorrect+recovered)/total));
  const plan = buildPlan(skills, missTypes, avgSec);
  return {nCorrect, total, curScore:cur, predScore:pred, missTypes, skills, results, plan,
          totalTime: Math.round(results.reduce((a,x)=>a+x.time,0))};
}
// ===== Priority ranker: wrongness × ACT-frequency × fixability =====
// Approx questions per real ACT test by topic/skill (from ACT domain weights + our audit).
// Keys cover both the 43 remediation topics AND the broader test-question skill names.
const ACT_FREQ = {
  // English (50q)
  commas:7, transitions:4.5, conciseness:4.5, add_delete_relevance:4.5, fragments_runons:3.5,
  subject_verb_agreement:2.5, verb_tense_form:2.5, pronouns:2.5, modifiers:2, parallel_structure:2,
  apostrophes:2, semicolons_colons:2.5, word_choice:2.5, organization:2.5, tone_style:2,
  punctuation:8, grammar:6, grammar_agreement:6, sentence_structure:4, transitions_flow:4.5,
  conciseness_precision:4.5, organization_placement:2.5,
  // Math (45q)
  linear_equations:5.5, expressions_word_problems:4.5, ratios_proportions:4, percents_rates:3,
  quadratics:2.5, exponents_radicals:2.5, function_notation:2.5, triangles:2.5, coordinate_geometry:2.5,
  area_perimeter_volume:2.5, statistics:2, angles_lines:2, circles:1.5, trigonometry:2, sequences:1.5,
  number_theory:1.5, inequalities:1.5, graph_transformations:1, probability:1.5, complex_matrices_sets:1,
  algebra:8, geometry:6, geometry_trig:6, functions_sequences:4, number_operations:3,
  probability_statistics:3, ratios_rates:4,
  // Science (40q)
  reading_data:15, trends_predictions:7, comparing_combining:7, experimental_design:5,
  evaluating_claims:4, scientific_math:3, outside_knowledge:3, data_interpretation:15, trends_extrapolation:7
};
function freqOf(skill){
  const k = String(skill||'').toLowerCase().replace(/\s+/g,'_');
  if(ACT_FREQ[k]!=null) return ACT_FREQ[k];
  for(const key in ACT_FREQ){ if(k.includes(key) || key.includes(k)) return ACT_FREQ[key]; }
  return 2; // neutral default
}
// How fast points come back, by the skill's dominant miss type.
const FIXABILITY = {"Didn't Read":1.0, Careless:0.9, Timing:0.8, Confidence:0.75, Guess:0.55, Content:0.6};
function rankPriorities(skills){
  const arr = Object.entries(skills).map(([k,s])=>{
    const misses = s.misses.length;
    const wrongness = misses + s.fragile*0.5;               // how much is broken here
    if(wrongness<=0) return null;
    const domEntry = Object.entries(s.types||{}).sort((a,b)=>b[1]-a[1])[0];
    const domMiss = domEntry ? domEntry[0] : null;
    const fixability = domMiss ? (FIXABILITY[domMiss]||0.6) : 0.6;
    const freq = freqOf(k);
    const priority = wrongness * (freq/2) * fixability;      // core formula
    const recoverable = wrongness * fixability;              // ~questions likely to flip correct
    const estPoints = +(recoverable * (freq>=4?0.28:0.18)).toFixed(2);
    return {skill:k, misses, fragile:s.fragile, mastery:s.mastery, freq, fixability, domMiss,
            priority:+priority.toFixed(2), estPoints};
  }).filter(Boolean);
  arr.sort((a,b)=>b.priority-a.priority);
  return arr;
}
function buildPlan(skills, missTypes, avgSec){
  const steps = [];
  const HABIT = {
    Careless:'Careless protocol: on easy questions, re-read the stem once and say what is being asked before answering.',
    Confidence:'Answer-changing rule: only switch when you can name the specific error in your first choice \u2014 a named reason, not a feeling.',
    Timing:'Pacing: know your checkpoint question at each quarter of the clock. Stuck past 90 seconds \u2014 best answer, flag it, move on. Never leave blanks.',
    Guess:'Guessed topics are untaught topics \u2014 they get instruction first, practice second.',
    "Didn't Read":'Unread questions are free points lost. Even when time is short, open every question, read the stem, and make your best elimination guess \u2014 never skip past one at 0 seconds.'
  };
  const habits = Object.entries(missTypes).filter(([ty,n])=>n>=2 && HABIT[ty]).sort((a,b)=>b[1]-a[1]);
  if(habits.length){
    steps.push({kind:'habit', title:'Test-taking habits \u2014 '+habits.map(([ty,n])=>ty+' \u00d7'+n).join(', '),
      desc: habits.map(([ty])=>HABIT[ty]).join(' ')});
  }
  const priorities = rankPriorities(skills);
  const ranked = priorities.slice(0,8).map(pr=>({k:pr.skill, s:skills[pr.skill], pr}));
  ranked.forEach(({k,s,pr})=>{
    const parts = [];
    if(pr && pr.freq>=4) parts.push('High-value target: this skill shows up ~'+Math.round(pr.freq)+'× on a real ACT, so fixing it moves your score the most.');
    const tagCount = {};
    s.misses.forEach(m=>{
      if(m.tag && m.tag!=='junk' && m.tag!=='correct'){
        if(!tagCount[m.tag]) tagCount[m.tag]={n:0, reason:m.distractorReason||''};
        tagCount[m.tag].n++;
      }
    });
    const recurring = Object.entries(tagCount).filter(([,v])=>v.n>=2);
    if(recurring.length){
      recurring.forEach(([tag,v])=>parts.push('You fell for the \u201c'+tag.replace(/_/g,' ')+'\u201d trap '+v.n+'\u00d7'+(v.reason?' \u2014 '+v.reason:'')+'.'));
    } else {
      const first = Object.entries(tagCount)[0];
      if(first && first[1].reason) parts.push('Trap you fell for: \u201c'+first[0].replace(/_/g,' ')+'\u201d \u2014 '+first[1].reason);
    }
    const p = PRESC[k];
    if(p){ parts.push(p.teach); if(p.drill) parts.push('Drill: '+p.drill); }
    else parts.push('Review this skill with your tutor, then do 10 targeted practice questions.');
    parts.push('Re-do your misses: '+s.misses.map(m=>'Q'+(m.i+1)).join(', ')+'.');
    if(s.fragile) parts.push('Also '+s.fragile+' correct-but-shaky answer'+(s.fragile>1?'s':'')+' here \u2014 this skill is not locked in yet.');
    steps.push({kind:'content', skill:k, title:'Fix: '+k.replace(/_/g,' ')+' ('+s.correct+'/'+s.total+' correct)', desc: parts.join(' ')});
  });
  if(steps.length) steps.push({kind:'habit', title:'Lock it in \u2014 retest',
    desc:'Within 7\u201310 days of finishing the steps above, retake a fresh form of this section. The predicted score on your dashboard assumes this plan is completed.'});
  return steps;
}
// ---------- FINISH & SAVE ----------
async function finishTest(timeExpired){
  if(T.submitting) return;              // guard: block double-submit
  const answered = T.rec.filter(r=>r.answer!==null).length;
  if(!timeExpired && answered===0){
    if(!confirm('You have not answered any questions yet. Submit a blank test anyway?')) return;
  }
  T.submitting = true;
  stampTime(); T.enteredAt=null;
  if(T.timerId) clearInterval(T.timerId);
  const a = analyze(T, timeExpired);
  document.getElementById('v-test').classList.add('hidden');
  document.getElementById('v-results').classList.remove('hidden');
  document.getElementById('v-results').innerHTML = '<div class="loading">Scoring and saving your results…</div>';
  try{
    const {data:sess, error:e1} = await db.from('sessions').insert({
      student_id:ME.id, test_id:T.test.id, timed:T.timed, started_at:T.startedIso,
      finished_at:new Date().toISOString(), raw_correct:a.nCorrect, raw_total:a.total,
      est_score:a.curScore, predicted_score:a.predScore
    }).select().single();
    if(e1) throw e1;
    const respRows = a.results.map((x,i)=>({
      session_id:sess.id, question_id:x.qid, position:i+1, answer:x.answer, correct:x.correct,
      time_spent_sec:x.time, confidence:x.conf, torn_between:x.torn, change_log:x.changes,
      miss_type:x.miss?x.miss.type:null, miss_reason:x.miss?x.miss.reason:null, fragile:x.fragile
    }));
    const {error:e2} = await db.from('responses').insert(respRows);
    if(e2) throw e2;
    const mastRows = Object.entries(a.skills).map(([k,s])=>({
      student_id:ME.id, session_id:sess.id, section:T.test.section, skill:k,
      mastery:s.mastery, correct:s.correct, total:s.total
    }));
    await db.from('mastery_snapshots').insert(mastRows);
    const {data:plan} = await db.from('study_plans').insert({session_id:sess.id, student_id:ME.id}).select().single();
    if(plan) await db.from('plan_steps').insert(a.plan.map((p,i)=>({plan_id:plan.id, position:i+1, kind:p.kind, title:p.title, description:p.desc, skill:p.skill||null})));
    renderReport(a, {name:T.test.name, student:ME.full_name||ME.email});
  }catch(e){
    renderReport(a, {name:T.test.name, student:ME.full_name||ME.email});
    document.getElementById('v-results').insertAdjacentHTML('afterbegin',
      '<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Results shown but NOT saved:</b> <span class="dim">'+esc(e.message||e)+'</span></div>');
  }
}

// ---------- REPORT RENDER (live or from DB) ----------

  const mt = Object.entries(a.missTypes).sort((x,y)=>y[1]-x[1]);

  document.getElementById('v-results').innerHTML =
  '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+esc(meta.student)+' — '+esc(meta.name)+'</h2><span class="row"><button class="btn2" onclick="window.print()">Print report</button><button class="btn2" onclick="renderHome().then(()=>go(\'home\'))">Back to dashboard</button></span></div>'+
  '<div class="statgrid" style="margin-top:16px">'+
    '<div class="stat"><div class="v">'+a.nCorrect+'/'+a.total+'</div><div class="l">Raw score</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--acc)" id="cuScore">0</div><div class="l">Est. ACT score</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--good)" id="cuPred">0</div><div class="l">Predicted after plan</div></div>'+
    '<div class="stat"><div class="v">'+fmtT(a.totalTime)+'</div><div class="l">Total time</div></div>'+
  '</div>'+
  '<div class="row" style="margin-top:14px">'+mt.map(([t,n])=>'<span class="pill '+PILL[t]+'">'+t+' ×'+n+'</span>').join(' ')+'</div>'+

  '<div class="grid2"><div class="card"><h2>Skill Mastery</h2><table><tr><th>Skill</th><th>Correct</th><th>Mastery</th><th></th><th>Miss types</th></tr>'+skillRows+'</table></div>'+
  '<div class="card"><h2>Targeted Study Plan</h2>'+planHtml+'</div></div>'+

// rebuild a report object from stored rows
async function openSession(sessionId){

  }));

    else { skills[k].types[x.miss.type]=(skills[k].types[x.miss.type]||0)+1; missTypes[x.miss.type]=(missTypes[x.miss.type]||0)+1; }
  });
  Object.values(skills).forEach(s=>s.mastery=Math.round(100*(s.correct-s.fragile*0.5)/s.total));
